<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASO — Atestado de Saúde Ocupacional</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#e0e0e0;font-family:Arial,sans-serif;color:#000;padding:20px;}
.screen-bar{text-align:center;margin-bottom:20px;display:flex;gap:10px;justify-content:center;}
.screen-bar button{padding:10px 24px;border:none;border-radius:6px;font-family:Arial;font-size:14px;cursor:pointer;font-weight:600;}
.btn-print{background:#1a6b3c;color:#fff;}
.btn-close{background:#555;color:#fff;}
.pages{display:flex;flex-direction:column;gap:20px;align-items:center;}
.page{width:210mm;min-height:297mm;background:#fff;padding:18mm 20mm 20mm;box-shadow:0 2px 12px rgba(0,0,0,.2);page-break-after:always;display:flex;flex-direction:column;font-size:10.5pt;line-height:1.45;}
.via-tag{text-align:right;font-size:9pt;font-weight:700;color:#555;margin-bottom:6mm;letter-spacing:.08em;}
.empresa-header{text-align:center;border-bottom:2pt solid #000;padding-bottom:5mm;margin-bottom:5mm;}
.empresa-nome{font-size:14pt;font-weight:700;margin-bottom:2mm;}
.empresa-sub{font-size:9pt;color:#444;}
.doc-titulo{text-align:center;font-size:13pt;font-weight:700;margin:5mm 0;text-transform:uppercase;letter-spacing:.06em;}
.secao{margin-bottom:6mm;}
.secao-titulo{font-weight:700;font-size:9.5pt;border-bottom:1pt solid #000;padding-bottom:2mm;margin-bottom:3mm;text-transform:uppercase;letter-spacing:.04em;}
.linha{display:flex;gap:5mm;margin-bottom:3mm;}
.campo{flex:1;}
.campo-label{font-size:8.5pt;font-weight:700;color:#333;margin-bottom:1mm;}
.campo-valor{font-size:10pt;border-bottom:0.7pt solid #555;padding-bottom:1mm;min-height:5.5mm;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8mm;margin-bottom:3mm;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6mm;margin-bottom:3mm;}
.riscos-box{border:0.7pt solid #ccc;border-radius:3pt;padding:4mm;background:#fafafa;font-size:9.5pt;}
.risco-item{padding:2mm 0;border-bottom:0.5pt solid #e5e5e5;display:flex;gap:4mm;}
.exames-table{width:100%;border-collapse:collapse;font-size:9pt;margin-top:2mm;}
.exames-table th{background:#222;color:#fff;padding:3mm 4mm;text-align:left;font-size:8.5pt;text-transform:uppercase;letter-spacing:.04em;}
.exames-table td{border:0.7pt solid #ccc;padding:2.5mm 4mm;vertical-align:top;}
.exames-table tr:nth-child(even) td{background:#f8f8f8;}
.resultado-box{text-align:center;border:2.5pt solid #000;border-radius:4pt;padding:5mm;margin:4mm 0;font-size:14pt;font-weight:700;letter-spacing:.06em;}
.resultado-apto{color:#00833e;border-color:#00833e;}
.resultado-inapto{color:#c0392b;border-color:#c0392b;}
.restricoes-box{border:0.7pt solid #ccc;border-radius:3pt;padding:4mm;background:#fffbf0;font-size:9.5pt;min-height:12mm;}
.assinaturas{display:grid;grid-template-columns:1fr 1fr;gap:16mm;margin-top:auto;padding-top:6mm;}
.assinatura{text-align:center;}
.assinatura-espaco{height:22mm;border-bottom:1pt solid #000;margin-bottom:2mm;}
.assinatura-nome{font-size:9pt;font-weight:700;}
.assinatura-sub{font-size:8pt;color:#666;margin-top:1mm;}
.rodape{font-size:7.5pt;color:#888;text-align:center;margin-top:auto;padding-top:4mm;border-top:0.5pt solid #ccc;}
@media print{
  body{background:#fff;padding:0;}
  .screen-bar{display:none;}
  .page{box-shadow:none;margin:0;}
  .pages{gap:0;}
}
</style>
</head>
<body>
<div class="screen-bar">
  <button class="btn-print" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
  <button id="btn-salvar-sistema" onclick="salvarPDFnoSistema()" style="padding:10px 24px;border:none;border-radius:6px;font-family:Arial;font-size:14px;cursor:pointer;font-weight:600;background:#1a6b6b;color:#fff;">💾 Salvar na ficha do funcionário</button>
  <button class="btn-close" onclick="window.close()">✕ Fechar</button>
</div>
<div id="msg-salvo" style="display:none;text-align:center;margin-bottom:10px;padding:12px;background:#0e2820;border:1px solid #1a4a38;border-radius:8px;color:#2dd4a0;font-family:Arial;font-size:14px;"></div>
<div class="pages" id="pages"></div>
<script>
const dados=JSON.parse(localStorage.getItem('sgs_aso_preview')||'{}');
const f=dados.funcionario||{};
const esc=s=>s===null||s===undefined?'':(s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtD=d=>{if(!d)return'—';const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('pt-BR');};

function renderVia(numVia,labelVia){
  const resultado=dados.resultado_geral||'Apto';
  const isApto=resultado==='Apto';
  const exames=(dados.exames||[]).map(e=>`<tr><td>${esc(e.nome_exame||'—')}</td><td>${esc(e.resultado_exame||'—')}</td><td>${fmtD(dados.data_exame)}</td></tr>`).join('');
  const riscos=(dados.riscos||[]).map(r=>`<div class="risco-item"><span>⚠</span><span>${esc(r)}</span></div>`).join('')||'<div style="color:#888;font-size:9pt;">Nenhum risco mapeado no PGR para esta função.</div>';

  return`<div class="page">
    <div class="via-tag">${numVia}ª VIA — ${labelVia}</div>
    <div class="empresa-header">
      <div class="empresa-nome">${esc(dados.empresa_nome||'EMPRESA')}</div>
      <div class="empresa-sub">Programa de Controle Médico de Saúde Ocupacional — NR-07</div>
    </div>
    <div class="doc-titulo">Atestado de Saúde Ocupacional — ASO</div>

    <div class="secao">
      <div class="secao-titulo">1. Identificação do Trabalhador</div>
      <div class="linha"><div class="campo"><div class="campo-label">Nome Completo</div><div class="campo-valor">${esc(f.nome_completo||'')}</div></div></div>
      <div class="grid2">
        <div class="campo"><div class="campo-label">CPF</div><div class="campo-valor">${esc(f.cpf||'—')}</div></div>
        <div class="campo"><div class="campo-label">RG</div><div class="campo-valor">${esc(f.rg||'—')}</div></div>
      </div>
      <div class="grid2">
        <div class="campo"><div class="campo-label">Função</div><div class="campo-valor">${esc(f.funcoes?.nome_funcao||'—')}</div></div>
        <div class="campo"><div class="campo-label">Setor</div><div class="campo-valor">${esc(f.setores?.nome_setor||'—')}</div></div>
      </div>
    </div>

    <div class="secao">
      <div class="secao-titulo">2. Tipo de ASO e Datas</div>
      <div class="grid3">
        <div class="campo"><div class="campo-label">Tipo de ASO</div><div class="campo-valor">${esc(dados.tipo_aso||'—')}</div></div>
        <div class="campo"><div class="campo-label">Data do Exame</div><div class="campo-valor">${fmtD(dados.data_exame)}</div></div>
        <div class="campo"><div class="campo-label">Próximo ASO</div><div class="campo-valor">${fmtD(dados.data_prox_aso)}</div></div>
      </div>
    </div>

    <div class="secao">
      <div class="secao-titulo">3. Riscos Ocupacionais da Função (PGR)</div>
      <div class="riscos-box">${riscos}</div>
    </div>

    <div class="secao">
      <div class="secao-titulo">4. Exames Realizados</div>
      <table class="exames-table">
        <thead><tr><th>Exame</th><th>Resultado</th><th>Data</th></tr></thead>
        <tbody>${exames||'<tr><td colspan="3" style="color:#888;">Nenhum exame registrado</td></tr>'}</tbody>
      </table>
    </div>

    <div class="secao">
      <div class="secao-titulo">5. Resultado Geral</div>
      <div class="resultado-box ${isApto?'resultado-apto':'resultado-inapto'}">${isApto?'✓ APTO':'✗ INAPTO'}</div>
      ${dados.restricoes?`<div class="secao-titulo" style="margin-top:3mm;">Restrições / Recomendações</div><div class="restricoes-box">${esc(dados.restricoes)}</div>`:''}
    </div>

    <div class="secao">
      <div class="secao-titulo">6. Médico Examinador</div>
      <div class="grid3">
        <div class="campo"><div class="campo-label">Nome</div><div class="campo-valor">${esc(dados.medico_nome||'—')}</div></div>
        <div class="campo"><div class="campo-label">CRM / UF</div><div class="campo-valor">${esc(dados.medico_crm||'—')} / ${esc(dados.medico_uf||'—')}</div></div>
        <div class="campo"><div class="campo-label">Data de emissão</div><div class="campo-valor">${fmtD(dados.data_exame)}</div></div>
      </div>
    </div>

    <div class="assinaturas">
      <div class="assinatura">
        <div class="assinatura-espaco"></div>
        <div class="assinatura-nome">${esc(dados.medico_nome||'—')}</div>
        <div class="assinatura-sub">Médico Examinador — CRM ${esc(dados.medico_crm||'')} / ${esc(dados.medico_uf||'')}</div>
      </div>
      <div class="assinatura">
        <div class="assinatura-espaco"></div>
        <div class="assinatura-nome">${esc(f.nome_completo||'—')}</div>
        <div class="assinatura-sub">${numVia===1?'Assinatura do Trabalhador — Recebimento da via':'Assinatura do Responsável pela Empresa'}</div>
      </div>
    </div>

    <div class="rodape">
      Emitido pelo SGS — Sistema de Gestão em SST &nbsp;·&nbsp; NR-07, Portaria MTb 3.214/78 &nbsp;·&nbsp; Documento válido com assinatura do médico examinador
    </div>
  </div>`;
}

if(!dados.funcionario){
  document.getElementById('pages').innerHTML='<div style="padding:40px;text-align:center;color:#888;">Nenhum dado de ASO encontrado. Feche esta janela e gere o ASO novamente.</div>';
  document.getElementById('btn-salvar-sistema').style.display='none';
}else{
  document.getElementById('pages').innerHTML=renderVia(1,'FUNCIONÁRIO')+renderVia(2,'EMPRESA');
}

// ── SALVAR PDF NO SISTEMA ─────────────────────────────────────
const SUPA_URL='https://ookqdukeulwcnhilbgbo.supabase.co';
const SUPA_KEY='sb_publishable_l9NggU-e1bgt7CnrYUWo4w_AMoaJa2e';
const _token=localStorage.getItem('sgs_token');

async function salvarPDFnoSistema(){
  if(!dados.funcionario){alert('Sem dados para salvar.');return;}
  const btn=document.getElementById('btn-salvar-sistema');
  const msg=document.getElementById('msg-salvo');
  btn.disabled=true;

  const mostrarErro=(txt)=>{
    msg.style.display='block';msg.style.background='#2a1515';msg.style.color='#e05555';msg.style.borderColor='#4a2020';
    msg.textContent='✕ '+txt;btn.disabled=false;btn.textContent='💾 Salvar na ficha do funcionário';
  };

  try{
    // 1. Salvar ASO no banco
    btn.textContent='⏳ Salvando dados...';
    const payloadASO={
      funcionario_id:dados.funcionario.id,
      tipo_aso:dados.tipo_aso,tipo_exame:dados.tipo_aso,
      data_exame:dados.data_exame,resultado:dados.resultado_geral,resultado_geral:dados.resultado_geral,
      data_validade_aso:dados.data_prox_aso,data_prox_aso:dados.data_prox_aso,
      cpf_funcionario:dados.funcionario.cpf,rg_funcionario:dados.funcionario.rg,
      nome_funcao:dados.funcionario.funcoes?.nome_funcao,nome_setor:dados.funcionario.setores?.nome_setor,
      riscos_ocupacionais:dados.riscos,restricoes_recomendacoes:dados.restricoes,observacoes:dados.restricoes,
      nome_medico_examinador:dados.medico_nome,crm_examinador:dados.medico_crm,uf_crm_examinador:dados.medico_uf,
      status_esocial:'Pendente'
    };
    const resS=await fetch(`${SUPA_URL}/rest/v1/esocial_s2220`,{method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${_token}`,'Prefer':'return=representation'},
      body:JSON.stringify(payloadASO)});
    if(!resS.ok){const e=await resS.json().catch(()=>({}));throw new Error(e.message||'Erro ao salvar ASO');}
    const [s2220]=await resS.json();

    // 2. Salvar exames
    for(const ex of (dados.exames||[])){
      if(!ex.exame_id&&!ex.nome_exame)continue;
      await fetch(`${SUPA_URL}/rest/v1/esocial_s2220_exames`,{method:'POST',
        headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${_token}`},
        body:JSON.stringify({s2220_id:s2220.id,exame_id:ex.exame_id||null,nome_exame:ex.nome_exame,data_exame:dados.data_exame,resultado_exame:ex.resultado_exame,obrigatorio_pela_funcao:ex.obrigatorio||false})});
    }

    // 3. Atualizar data_prox_aso no funcionário
    if(dados.data_prox_aso){
      await fetch(`${SUPA_URL}/rest/v1/funcionarios?id=eq.${dados.funcionario.id}`,{method:'PATCH',
        headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${_token}`},
        body:JSON.stringify({data_prox_aso:dados.data_prox_aso,aso_ultima_data:dados.data_exame,aso_ultimo_resultado:dados.resultado_geral})});
    }

    // 4. Gerar PDF
    btn.textContent='⏳ Gerando PDF...';
    const elemento=document.getElementById('pages');
    const nomeFunc=(dados.funcionario?.nome_completo||'func').replace(/\s+/g,'_');
    const opt={margin:0,filename:`ASO_${nomeFunc}.pdf`,image:{type:'jpeg',quality:0.97},html2canvas:{scale:2,useCORS:true,logging:false},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}};
    const pdfBlob=await html2pdf().set(opt).from(elemento).outputPdf('blob');

    // 5. Upload PDF
    btn.textContent='⏳ Salvando PDF...';
    const empresaId=dados.funcionario?.empresa_id;
    const funcId=dados.funcionario?.id;
    const path=`${empresaId}/asos/${funcId}_aso_${s2220.id}_${Date.now()}.pdf`;
    const resUp=await fetch(`${SUPA_URL}/storage/v1/object/documentos-funcionarios/${path}`,{method:'POST',
      headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${_token}`,'x-upsert':'true','Content-Type':'application/pdf'},body:pdfBlob});
    if(!resUp.ok){const e=await resUp.json().catch(()=>({}));throw new Error(e.message||'Erro no upload do PDF');}

    // 6. Atualizar URL do PDF no ASO
    await fetch(`${SUPA_URL}/rest/v1/esocial_s2220?id=eq.${s2220.id}`,{method:'PATCH',
      headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${_token}`},
      body:JSON.stringify({arquivo_pdf_url:path})});

    msg.style.display='block';msg.style.background='#0e2820';msg.style.color='#2dd4a0';msg.style.borderColor='#1a4a38';
    msg.textContent='✅ ASO salvo com sucesso! Acesse a ficha do funcionário → aba ASOs para visualizar e anexar a versão assinada.';
    btn.textContent='✅ Salvo!';
    // Atualiza dados com aso_id para próximas operações
    dados.aso_id=s2220.id;
    localStorage.setItem('sgs_aso_preview',JSON.stringify(dados));
  }catch(e){mostrarErro(e.message);}
}
</script>
</body>
</html>
