<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASO — Atestado de Saúde Ocupacional</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --aso-dark:#00420f;--aso-mid:#00642a;--aso-accent:#00833e;--aso-light:#e6f4ea;--aso-muted:#f1f8f4;
  --text-dark:#0d1f0d;--text-mid:#1f2937;--text-muted:#6b7280;--border:#e5e7eb;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f1117;color:#e8eaf0;font-family:var(--sans);padding:24px 20px;}
.screen-bar{display:flex;gap:10px;justify-content:center;margin-bottom:24px;}
.screen-bar button{padding:10px 24px;border:none;border-radius:6px;font-family:var(--sans);font-size:13px;cursor:pointer;font-weight:600;}
.btn-print{background:#2dd4a0;color:#0f1117;}
.btn-save-sys{background:#1a5f6b;color:#fff;}
.btn-close{background:#374151;color:#e5e7eb;}
.pages{display:flex;flex-direction:column;gap:24px;align-items:center;}

/* ── PÁGINA A4 ── */
.page{
  background:#fff;width:210mm;min-height:297mm;
  padding:14mm 18mm 28mm 26mm;
  box-shadow:0 4px 32px rgba(0,0,0,.5);
  position:relative;
  color:var(--text-mid);
  font-family:var(--sans);font-size:10pt;line-height:1.5;
  display:flex;flex-direction:column;
  page-break-after:always;
}
.page::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:8mm;
  background:linear-gradient(180deg,#00642a 0%,#00420f 100%);
}

/* ── PAGE HEADER ── */
.page-header{
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1.5pt solid var(--border);padding-bottom:7pt;margin-bottom:12pt;
}
.ph-empresa{font-size:8.5pt;font-weight:700;color:var(--text-dark);}
.ph-doc{font-size:8pt;color:var(--text-muted);font-family:var(--mono);}

/* ── PAGE FOOTER ── */
.page-footer{
  position:absolute;bottom:10mm;left:26mm;right:18mm;
  display:flex;justify-content:space-between;align-items:center;
  border-top:1pt solid var(--border);padding-top:5pt;
}
.pf-label{font-size:7pt;color:var(--text-muted);}
.pf-page{font-family:var(--mono);font-size:8pt;color:#4b5563;font-weight:600;}

/* ── VIA TAG ── */
.via-tag{
  font-family:var(--mono);font-size:8pt;font-weight:700;
  color:var(--aso-mid);letter-spacing:.1em;text-transform:uppercase;
  text-align:right;margin-bottom:10pt;
}

/* ── EMPRESA HEADER BLOCK ── */
.empresa-header{
  background:var(--aso-muted);border-left:4pt solid var(--aso-accent);
  padding:11pt 16pt;margin-bottom:12pt;border-radius:0 6pt 6pt 0;
}
.empresa-nome{font-size:15pt;font-weight:700;color:var(--aso-dark);margin-bottom:2pt;line-height:1.2;}
.empresa-cnpj{font-size:8.5pt;color:var(--text-muted);font-family:var(--mono);margin-bottom:2pt;}
.empresa-sub{font-size:8.5pt;color:var(--text-muted);}

/* ── DOC TITLE ── */
.doc-titulo{
  text-align:center;font-size:14pt;font-weight:700;color:var(--aso-dark);
  text-transform:uppercase;letter-spacing:.06em;
  padding-bottom:8pt;margin-bottom:14pt;
  border-bottom:2pt solid var(--aso-accent);
}

/* ── SECTIONS ── */
.secao{margin-bottom:11pt;}
.doc-section{
  font-size:9pt;font-weight:700;color:var(--aso-dark);
  text-transform:uppercase;letter-spacing:.06em;
  border-bottom:2pt solid var(--aso-accent);
  padding-bottom:4pt;margin-bottom:7pt;
}

/* ── FICHA GRID ── */
.ficha-grid{
  border:1pt solid var(--border);border-radius:4pt;overflow:hidden;
}
.ficha-row{display:grid;}
.ficha-row-1{grid-template-columns:1fr;}
.ficha-row-2{grid-template-columns:1fr 1fr;}
.ficha-row-3{grid-template-columns:1fr 1fr 1fr;}
.ficha-row:not(:last-child){border-bottom:1pt solid var(--border);}
.ficha-item{padding:7pt 10pt;}
.ficha-item:not(:last-child){border-right:1pt solid var(--border);}
.ficha-label{font-size:7pt;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:2pt;font-family:var(--mono);}
.ficha-value{font-size:10pt;color:var(--aso-dark);font-weight:500;}

/* ── RISCOS ── */
.riscos-box{border:1pt solid #c3e6cb;border-radius:4pt;background:var(--aso-muted);padding:7pt 10pt;}
.risco-item{padding:3pt 0;border-bottom:1pt solid #d4edda;display:flex;gap:7pt;font-size:9.5pt;align-items:flex-start;}
.risco-item:last-child{border-bottom:none;}
.risco-ico{color:var(--aso-mid);font-size:10pt;flex-shrink:0;line-height:1.5;}

/* ── EXAMES TABLE ── */
.doc-table{width:100%;border-collapse:collapse;font-size:9pt;}
.doc-table th{
  background:var(--aso-dark);color:#fff;
  padding:6pt 8pt;text-align:left;
  font-size:8pt;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  font-family:var(--mono);
}
.doc-table td{padding:6pt 8pt;border-bottom:1pt solid var(--border);vertical-align:middle;color:var(--text-mid);}
.doc-table tr:last-child td{border-bottom:none;}
.doc-table tr:nth-child(even) td{background:#f9fafb;}

/* ── RESULTADO ── */
.resultado-badge{
  display:flex;align-items:center;justify-content:center;gap:10pt;
  padding:10pt 16pt;border-radius:6pt;
  font-size:16pt;font-weight:700;letter-spacing:.06em;margin:3pt 0 6pt;
}
.badge-apto{background:#dcfce7;color:#166534;border:2pt solid #86efac;}
.badge-inapto{background:#fee2e2;color:#991b1b;border:2pt solid #fca5a5;}

/* ── RESTRIÇÕES / ATIVIDADES ── */
.restricoes-box{border:1pt solid #fed7aa;border-radius:4pt;padding:8pt 10pt;background:#fffbeb;font-size:9.5pt;line-height:1.5;}
.atv-box{border:1pt solid #86efac;border-radius:4pt;padding:8pt 10pt;background:#f0fdf4;font-size:9.5pt;line-height:1.5;}

/* ── ASSINATURAS ── */
.assinaturas{display:grid;grid-template-columns:1fr 1fr;gap:14mm;margin-top:auto;padding-top:8pt;}
.assinatura{text-align:center;}
.assinatura-linha{height:18mm;border-bottom:1pt solid #374151;margin-bottom:4pt;}
.assinatura-nome{font-size:9pt;font-weight:700;color:var(--text-dark);}
.assinatura-sub{font-size:7.5pt;color:var(--text-muted);margin-top:1pt;font-family:var(--mono);}

/* ── PRINT ── */
@media print{
  body{background:#fff!important;padding:0!important;}
  .screen-bar,#msg-salvo{display:none!important;}
  .pages{gap:0!important;}
  .page{box-shadow:none!important;margin:0!important;}
  .page::before,.doc-table th,.resultado-badge,.empresa-header,.riscos-box,.restricoes-box,.atv-box{
    -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;
  }
}
@media(max-width:230mm){
  .page{width:100%;padding:12mm 14mm 22mm 18mm;}
  .page::before{width:5mm;}
}
</style>
</head>
<body>
<div class="screen-bar">
  <button class="btn-print" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
  <button id="btn-salvar-sistema" class="btn-save-sys" onclick="salvarPDFnoSistema()">💾 Salvar na ficha do funcionário</button>
  <button class="btn-close" onclick="window.close()">✕ Fechar</button>
</div>
<div id="msg-salvo" style="display:none;text-align:center;margin-bottom:10px;padding:12px;background:#0e2820;border:1px solid #1a4a38;border-radius:8px;color:#2dd4a0;font-family:var(--sans);font-size:14px;"></div>
<div class="pages" id="pages"></div>
<script>
const dados=JSON.parse(localStorage.getItem('sgs_aso_preview')||'{}');
const f=dados.funcionario||{};
const esc=s=>s===null||s===undefined?'':(s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtD=d=>{if(!d)return'—';const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('pt-BR');};
const fmtCNPJ=c=>{if(!c)return'';const n=c.replace(/\D/g,'');return n.length===14?n.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'):c;};

function renderVia(numVia,labelVia){
  const resultado=dados.resultado_geral||'Apto';
  const isApto=resultado==='Apto';

  const exames=(dados.exames||[]).map(e=>`
    <tr><td>${esc(e.nome_exame||'—')}</td><td style="white-space:nowrap;width:28mm;">${fmtD(dados.data_exame)}</td></tr>`).join('');

  const riscos=(dados.riscos||[]).map(r=>`
    <div class="risco-item"><span class="risco-ico">▸</span><span>${esc(r)}</span></div>`).join('')
    ||'<div style="color:#6b7280;font-size:9pt;padding:3pt 0;">Nenhum risco mapeado no PGR para esta função.</div>';

  const blocoMedicosPcmso=dados.medico_pcmso_nome
    ?`<div class="ficha-grid">
        <div class="ficha-row ficha-row-3">
          <div class="ficha-item"><div class="ficha-label">Nome</div><div class="ficha-value">${esc(dados.medico_pcmso_nome)}</div></div>
          <div class="ficha-item"><div class="ficha-label">CRM / UF</div><div class="ficha-value">${esc(dados.medico_pcmso_crm||'—')} / ${esc(dados.medico_pcmso_uf||'—')}</div></div>
          <div class="ficha-item"><div class="ficha-label">Responsabilidade</div><div class="ficha-value">Coordenador do PCMSO</div></div>
        </div>
      </div>`
    :`<div style="font-size:9pt;color:#6b7280;padding:5pt 0;font-family:var(--mono);">Mesmo médico examinador — ${esc(dados.medico_nome||'—')} · CRM ${esc(dados.medico_crm||'—')}/${esc(dados.medico_uf||'—')}</div>`;

  const assinaturas=dados.medico_pcmso_nome
    ?`<div class="assinaturas" style="grid-template-columns:1fr 1fr 1fr;">
        <div class="assinatura"><div class="assinatura-linha"></div><div class="assinatura-nome">${esc(dados.medico_nome||'—')}</div><div class="assinatura-sub">Médico Examinador · CRM ${esc(dados.medico_crm||'')}/${esc(dados.medico_uf||'')}</div></div>
        <div class="assinatura"><div class="assinatura-linha"></div><div class="assinatura-nome">${esc(dados.medico_pcmso_nome)}</div><div class="assinatura-sub">Resp. PCMSO · CRM ${esc(dados.medico_pcmso_crm||'')}/${esc(dados.medico_pcmso_uf||'')}</div></div>
        <div class="assinatura"><div class="assinatura-linha"></div><div class="assinatura-nome">${esc(f.nome_completo||'—')}</div><div class="assinatura-sub">${numVia===1?'Trabalhador — Recebimento da via':'Responsável pela Empresa'}</div></div>
      </div>`
    :`<div class="assinaturas">
        <div class="assinatura"><div class="assinatura-linha"></div><div class="assinatura-nome">${esc(dados.medico_nome||'—')}</div><div class="assinatura-sub">Médico Examinador · CRM ${esc(dados.medico_crm||'')} / ${esc(dados.medico_uf||'')}</div></div>
        <div class="assinatura"><div class="assinatura-linha"></div><div class="assinatura-nome">${esc(f.nome_completo||'—')}</div><div class="assinatura-sub">${numVia===1?'Trabalhador — Recebimento da via':'Responsável pela Empresa'}</div></div>
      </div>`;

  return`<div class="page">

    <div class="page-header">
      <span class="ph-empresa">${esc(dados.empresa_nome||'EMPRESA')}${dados.empresa_cnpj?' · CNPJ '+fmtCNPJ(dados.empresa_cnpj):''}</span>
      <span class="ph-doc">ASO · NR-07 · ${fmtD(dados.data_exame)}</span>
    </div>

    <div class="via-tag">${numVia}ª VIA — ${labelVia}</div>

    <div class="empresa-header">
      <div class="empresa-nome">${esc(dados.empresa_nome||'EMPRESA')}</div>
      ${dados.empresa_cnpj?`<div class="empresa-cnpj">CNPJ: ${fmtCNPJ(dados.empresa_cnpj)}</div>`:''}
      <div class="empresa-sub">Programa de Controle Médico de Saúde Ocupacional — NR-07</div>
    </div>

    <div class="doc-titulo">Atestado de Saúde Ocupacional — ASO</div>

    <div class="secao">
      <div class="doc-section">1. Identificação do Trabalhador</div>
      <div class="ficha-grid">
        <div class="ficha-row ficha-row-1">
          <div class="ficha-item"><div class="ficha-label">Nome Completo</div><div class="ficha-value" style="font-size:11pt;">${esc(f.nome_completo||'—')}</div></div>
        </div>
        <div class="ficha-row ficha-row-2">
          <div class="ficha-item"><div class="ficha-label">CPF</div><div class="ficha-value">${esc(f.cpf||'—')}</div></div>
          <div class="ficha-item"><div class="ficha-label">RG</div><div class="ficha-value">${esc(f.rg||'—')}</div></div>
        </div>
        <div class="ficha-row ficha-row-2">
          <div class="ficha-item"><div class="ficha-label">Função</div><div class="ficha-value">${esc(f.funcoes?.nome_funcao||'—')}</div></div>
          <div class="ficha-item"><div class="ficha-label">Setor</div><div class="ficha-value">${esc(f.setores?.nome_setor||'—')}</div></div>
        </div>
      </div>
    </div>

    <div class="secao">
      <div class="doc-section">2. Tipo de ASO e Datas</div>
      <div class="ficha-grid">
        <div class="ficha-row ficha-row-3">
          <div class="ficha-item"><div class="ficha-label">Tipo de ASO</div><div class="ficha-value">${esc(dados.tipo_aso||'—')}</div></div>
          <div class="ficha-item"><div class="ficha-label">Data do Exame</div><div class="ficha-value">${fmtD(dados.data_exame)}</div></div>
          <div class="ficha-item"><div class="ficha-label">Próximo ASO</div><div class="ficha-value">${fmtD(dados.data_prox_aso)}</div></div>
        </div>
      </div>
    </div>

    <div class="secao">
      <div class="doc-section">3. Riscos Ocupacionais da Função (PGR)</div>
      <div class="riscos-box">${riscos}</div>
    </div>

    <div class="secao">
      <div class="doc-section">4. Exames Realizados</div>
      <table class="doc-table">
        <thead><tr><th>Exame</th><th>Data</th></tr></thead>
        <tbody>${exames||'<tr><td colspan="2" style="color:#6b7280;text-align:center;padding:10pt;">Nenhum exame registrado</td></tr>'}</tbody>
      </table>
    </div>

    <div class="secao">
      <div class="doc-section">5. Resultado Geral</div>
      <div class="resultado-badge ${isApto?'badge-apto':'badge-inapto'}">${isApto?'✓ APTO':'✗ INAPTO'}</div>
      ${dados.restricoes?`<div style="font-size:8pt;font-weight:700;color:#92400e;text-transform:uppercase;letter-spacing:.04em;margin:6pt 0 4pt;font-family:var(--mono);">Restrições / Recomendações</div><div class="restricoes-box">${esc(dados.restricoes)}</div>`:''}
    </div>

    <div class="secao">
      <div class="doc-section">6a. Médico Examinador</div>
      <div class="ficha-grid">
        <div class="ficha-row ficha-row-3">
          <div class="ficha-item"><div class="ficha-label">Nome</div><div class="ficha-value">${esc(dados.medico_nome||'—')}</div></div>
          <div class="ficha-item"><div class="ficha-label">CRM / UF</div><div class="ficha-value">${esc(dados.medico_crm||'—')} / ${esc(dados.medico_uf||'—')}</div></div>
          <div class="ficha-item"><div class="ficha-label">Data do Exame Clínico</div><div class="ficha-value">${fmtD(dados.data_exame)}</div></div>
        </div>
      </div>
    </div>

    <div class="secao">
      <div class="doc-section">6b. Médico Responsável pelo PCMSO</div>
      ${blocoMedicosPcmso}
    </div>

    ${dados.aptidao_atividades_especificas?`
    <div class="secao">
      <div class="doc-section">7. Aptidão para Atividades Específicas — NR-07 7.5.19.2</div>
      <div class="atv-box">${esc(dados.aptidao_atividades_especificas)}</div>
    </div>`:''}

    ${assinaturas}

    <div class="page-footer">
      <span class="pf-label">NR-07, Portaria MTb 3.214/78 · Válido com assinatura do médico examinador</span>
      <span class="pf-page">SGS · Pág. ${numVia}/2</span>
    </div>
  </div>`;
}

if(!dados.funcionario){
  document.getElementById('pages').innerHTML='<div style="padding:40px;text-align:center;color:#6b7280;">Nenhum dado de ASO encontrado. Feche esta janela e gere o ASO novamente.</div>';
  document.getElementById('btn-salvar-sistema').style.display='none';
}else{
  document.getElementById('pages').innerHTML=renderVia(1,'FUNCIONÁRIO')+renderVia(2,'EMPRESA');
}

// ── SALVAR PDF NO SISTEMA ─────────────────────────────────────
const SUPA_URL='https://ookqdukeulwcnhilbgbo.supabase.co';
const SUPA_KEY='sb_publishable_l9NggU-e1bgt7CnrYUWo4w_AMoaJa2e';
const _token=localStorage.getItem('sgs_token');

async function salvarPDFnoSistema(){
  if(!dados.funcionario){alert('Sem dados para salvar.');return;}
  const btn=document.getElementById('btn-salvar-sistema');
  const msg=document.getElementById('msg-salvo');
  btn.disabled=true;

  const mostrarErro=(txt)=>{
    msg.style.display='block';msg.style.background='#2a1515';msg.style.color='#e05555';msg.style.borderColor='#4a2020';
    msg.textContent='✕ '+txt;btn.disabled=false;btn.textContent='💾 Salvar na ficha do funcionário';
  };

  try{
    btn.textContent='⏳ Salvando dados...';
    const payloadASO={
      funcionario_id:dados.funcionario.id,
      tipo_aso:dados.tipo_aso,tipo_exame:dados.tipo_aso,
      data_exame:dados.data_exame,resultado:dados.resultado_geral,resultado_geral:dados.resultado_geral,
      data_validade_aso:dados.data_prox_aso,data_prox_aso:dados.data_prox_aso,
      cpf_funcionario:dados.funcionario.cpf,rg_funcionario:dados.funcionario.rg,
      nome_funcao:dados.funcionario.funcoes?.nome_funcao,nome_setor:dados.funcionario.setores?.nome_setor,
      riscos_ocupacionais:dados.riscos,restricoes_recomendacoes:dados.restricoes,observacoes:dados.restricoes,
      nome_medico_examinador:dados.medico_nome,crm_examinador:dados.medico_crm,uf_crm_examinador:dados.medico_uf,
      nome_medico_coordenador:dados.medico_pcmso_nome||null,crm_coordenador:dados.medico_pcmso_crm||null,uf_crm_coordenador:dados.medico_pcmso_uf||null,
      cnpj_empresa:dados.empresa_cnpj||null,aptidao_atividades_especificas:dados.aptidao_atividades_especificas||null,
      status_esocial:'Pendente'
    };
    const resS=await fetch(`${SUPA_URL}/rest/v1/esocial_s2220`,{method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${_token}`,'Prefer':'return=representation'},
      body:JSON.stringify(payloadASO)});
    if(!resS.ok){const e=await resS.json().catch(()=>({}));throw new Error(e.message||'Erro ao salvar ASO');}
    const [s2220]=await resS.json();

    for(const ex of (dados.exames||[])){
      if(!ex.exame_id&&!ex.nome_exame)continue;
      await fetch(`${SUPA_URL}/rest/v1/esocial_s2220_exames`,{method:'POST',
        headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${_token}`},
        body:JSON.stringify({s2220_id:s2220.id,exame_id:ex.exame_id||null,nome_exame:ex.nome_exame,data_exame:dados.data_exame,resultado_exame:ex.resultado_exame,obrigatorio_pela_funcao:ex.obrigatorio||false})});
    }

    if(dados.data_prox_aso){
      await fetch(`${SUPA_URL}/rest/v1/funcionarios?id=eq.${dados.funcionario.id}`,{method:'PATCH',
        headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${_token}`},
        body:JSON.stringify({data_prox_aso:dados.data_prox_aso,aso_ultima_data:dados.data_exame,aso_ultimo_resultado:dados.resultado_geral})});
    }

    btn.textContent='⏳ Gerando PDF...';
    const elemento=document.getElementById('pages');
    const nomeFunc=(dados.funcionario?.nome_completo||'func').replace(/\s+/g,'_');
    const opt={margin:0,filename:`ASO_${nomeFunc}.pdf`,image:{type:'jpeg',quality:0.97},html2canvas:{scale:2,useCORS:true,logging:false},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}};
    const pdfBlob=await html2pdf().set(opt).from(elemento).outputPdf('blob');

    btn.textContent='⏳ Salvando PDF...';
    const empresaId=dados.funcionario?.empresa_id;
    const funcId=dados.funcionario?.id;
    const path=`${empresaId}/asos/${funcId}_aso_${s2220.id}_${Date.now()}.pdf`;
    const resUp=await fetch(`${SUPA_URL}/storage/v1/object/documentos-funcionarios/${path}`,{method:'POST',
      headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${_token}`,'x-upsert':'true','Content-Type':'application/pdf'},body:pdfBlob});
    if(!resUp.ok){const e=await resUp.json().catch(()=>({}));throw new Error(e.message||'Erro no upload do PDF');}

    await fetch(`${SUPA_URL}/rest/v1/esocial_s2220?id=eq.${s2220.id}`,{method:'PATCH',
      headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${_token}`},
      body:JSON.stringify({arquivo_pdf_url:path})});

    msg.style.display='block';msg.style.background='#0e2820';msg.style.color='#2dd4a0';msg.style.borderColor='#1a4a38';
    msg.textContent='✅ ASO salvo com sucesso! Acesse a ficha do funcionário → aba ASOs para visualizar e anexar a versão assinada.';
    btn.textContent='✅ Salvo!';
    dados.aso_id=s2220.id;
    localStorage.setItem('sgs_aso_preview',JSON.stringify(dados));
  }catch(e){mostrarErro(e.message);}
}
</script>
