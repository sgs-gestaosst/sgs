name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 */4 * * *'  # a cada 4 horas
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase database
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ookqdukeulwcnhilbgbo.supabase.co/rest/v1/empresas?select=id&limit=1" \
            -H "apikey: sb_publishable_l9NggU-e1bgt7CnrYUWo4w_AMoaJa2e" \
            -H "Authorization: Bearer sb_publishable_l9NggU-e1bgt7CnrYUWo4w_AMoaJa2e")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "AVISO: Supabase retornou status $STATUS"
            exit 1
          fi
          echo "Supabase ativo."
