<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PGR — Programa de Gerenciamento de Riscos</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2333;--border:#2a3044;--border-focus:#4a7cdc;
  --accent:#4a7cdc;--accent2:#2dd4a0;--text:#e8eaf0;--text2:#8892a4;--text3:#545e72;
  --danger:#e05555;--warning:#e0a855;
  --radius:6px;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;}
.screen-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
.header-logo{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.08em;border:1px solid var(--border-focus);padding:4px 10px;border-radius:var(--radius);text-decoration:none;}
.screen-actions{margin-left:auto;display:flex;gap:10px;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;text-decoration:none;}
.btn-edit{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-edit:hover{border-color:var(--border-focus);}
.btn-print{background:var(--accent2);color:#0f1117;}
.btn-print:hover{background:#3de8b4;}
.screen-body{padding:40px 24px;display:flex;justify-content:center;}
.pages-wrap{display:flex;flex-direction:column;gap:24px;align-items:center;width:100%;}

/* ── FOLHA A4 ── */
.page{
  background:#fff;width:210mm;min-height:297mm;
  padding:20mm 20mm 32mm 25mm;
  box-shadow:0 4px 32px rgba(0,0,0,.5);
  position:relative;color:#1a1a2e;
  font-family:'IBM Plex Sans',sans-serif;font-size:10pt;line-height:1.5;
}
.page::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:8mm;
  background:linear-gradient(180deg,#1a3a6e 0%,#0d2040 100%);
}

/* ── TIPOGRAFIA ── */
.doc-title{font-size:22pt;font-weight:700;color:#0d2040;line-height:1.2;margin-bottom:4pt;}
.doc-section{font-size:11pt;font-weight:700;color:#0d2040;text-transform:uppercase;letter-spacing:.06em;border-bottom:2pt solid #1a3a6e;padding-bottom:5pt;margin:18pt 0 11pt;}
.doc-subsection{font-size:10pt;font-weight:600;color:#1e3a5f;margin:12pt 0 7pt;padding-bottom:3pt;border-bottom:1pt solid #e5e7eb;}
.doc-text{font-size:10pt;color:#1f2937;line-height:1.65;text-align:justify;}
.num-secao{color:#4a7cdc;font-family:'IBM Plex Mono',monospace;font-size:9pt;margin-right:6pt;}

/* ── CAPA ── */
.capa{display:flex;flex-direction:column;height:100%;max-height:257mm;overflow:hidden;}
.capa-topo{display:flex;align-items:center;gap:14pt;margin-bottom:4pt;}
.capa-topo-info{flex:1;min-width:0;}
.capa-topo-nome{font-size:13pt;font-weight:700;color:#0d2040;line-height:1.2;}
.capa-topo-meta{font-size:8.5pt;color:#4b5563;margin-top:3pt;}
.capa-logo-box{width:60pt;height:60pt;background:#0d2040;display:flex;align-items:center;justify-content:center;border-radius:6pt;flex-shrink:0;overflow:hidden;}
.capa-logo-text{font-family:'IBM Plex Mono',monospace;font-size:18pt;font-weight:700;color:#fff;}
.capa-divider{height:3pt;background:linear-gradient(90deg,#1a3a6e,#2a5298,#4a7cdc);margin:16pt 0 18pt;border-radius:2pt;}
.capa-titulo-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;}
.capa-pre{font-size:9pt;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:#2a5298;margin-bottom:8pt;}
.capa-titulo{font-size:30pt;font-weight:700;color:#0d2040;line-height:1.15;margin-bottom:6pt;letter-spacing:-.01em;}
.capa-titulo-sub{font-size:13pt;color:#2a5298;font-weight:500;margin-bottom:24pt;}
.capa-empresa-box{background:#f0f4ff;border-left:4pt solid #2a5298;padding:14pt 18pt;margin-bottom:18pt;border-radius:0 6pt 6pt 0;}
.capa-empresa-nome{font-size:15pt;font-weight:700;color:#0d2040;margin-bottom:3pt;}
.capa-empresa-cnpj{font-size:9pt;color:#4b5563;font-family:'IBM Plex Mono',monospace;}
.capa-badges{display:flex;gap:8pt;flex-wrap:wrap;margin-top:10pt;}
.capa-badge{padding:3pt 10pt;border-radius:20pt;font-size:8pt;font-weight:600;border:1pt solid;}
.badge-gr1{background:#e6fff9;color:#047857;border-color:#6ee7b7;}
.badge-gr2{background:#eff6ff;color:#1d4ed8;border-color:#93c5fd;}
.badge-gr3{background:#fffbeb;color:#92400e;border-color:#fcd34d;}
.badge-gr4{background:#fff1f2;color:#9f1239;border-color:#fca5a5;}
.badge-info{background:#f3f4f6;color:#374151;border-color:#d1d5db;}
.capa-rodape-bloco{margin-top:auto;}
.capa-footer{border-top:1pt solid #d1d5db;padding-top:10pt;display:flex;justify-content:space-between;align-items:center;}
.capa-footer-label{font-size:7.5pt;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.capa-footer-value{font-size:9.5pt;color:#1f2937;font-weight:600;margin-top:2pt;}
/* Faixa discreta da empresa elaboradora */
.capa-elab-strip{margin-top:12pt;padding:10pt 12pt;border:1pt solid #e5e7eb;border-radius:6pt;background:#fafbfc;display:flex;align-items:center;gap:14pt;}
.capa-elab-strip-label{font-size:7.5pt;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.1em;flex-shrink:0;}
.capa-elab-strip-content{display:flex;align-items:center;gap:10pt;flex:1;min-width:0;}
.capa-elab-strip-logo{width:32pt;height:32pt;background:#f3f4f6;border:1pt solid #d1d5db;border-radius:5pt;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.capa-elab-strip-sigla{font-family:'IBM Plex Mono',monospace;font-size:10pt;font-weight:700;color:#4b5563;}
.capa-elab-strip-nome{font-size:9.5pt;font-weight:600;color:#1f2937;line-height:1.3;}
.capa-elab-strip-cnpj{font-size:8pt;color:#4b5563;font-family:'IBM Plex Mono',monospace;margin-top:1pt;}

/* ── HEADER/FOOTER PÁGINAS ── */
.page-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1.5pt solid #e5e7eb;padding-bottom:8pt;margin-bottom:16pt;}
.ph-empresa{font-size:8.5pt;font-weight:700;color:#1f2937;}
.ph-doc{font-size:8pt;color:#6b7280;font-family:'IBM Plex Mono',monospace;}
.page-footer{position:absolute;bottom:12mm;left:25mm;right:14mm;display:flex;justify-content:space-between;align-items:center;border-top:1pt solid #e5e7eb;padding-top:6pt;}
.pf-label{font-size:7.5pt;color:#6b7280;font-weight:500;}
.pf-page{font-family:'IBM Plex Mono',monospace;font-size:8pt;color:#4b5563;font-weight:600;}
/* Garante espaço para o rodapé absoluto na tela */
.page{padding-bottom:28mm;}

/* ── TABELAS ── */
.doc-table{width:100%;border-collapse:collapse;margin:8pt 0;font-size:9pt;}
.doc-table th{background:#0d2040;color:#fff;padding:6pt 8pt;text-align:left;font-size:8pt;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.doc-table td{padding:6pt 8pt;border-bottom:1pt solid #e5e7eb;vertical-align:top;color:#1f2937;}
.doc-table tr:nth-child(even) td{background:#f9fafb;}
.doc-table tr:last-child td{border-bottom:none;}

/* ── FICHAS ── */
.ficha-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1pt solid #e5e7eb;border-radius:4pt;overflow:hidden;margin:8pt 0;}
.ficha-grid-3{grid-template-columns:1fr 1fr 1fr;}
.ficha-item{padding:8pt 10pt;border-right:1pt solid #e5e7eb;border-bottom:1pt solid #e5e7eb;}
.ficha-item:nth-child(2n){border-right:none;}
.ficha-grid-3 .ficha-item:nth-child(3n){border-right:none;}
.ficha-item:last-child,.ficha-item:nth-last-child(2){border-bottom:none;}
.ficha-label{font-size:7.5pt;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;margin-bottom:3pt;}
.ficha-value{font-size:10pt;color:#0d2040;font-weight:500;}
.ficha-full{grid-column:1/-1;border-right:none!important;}

/* ── INVENTÁRIO DE RISCOS — GHE ── */
.funcao-bloco{
  border:1.5pt solid #bfdbfe;
  border-radius:8pt;
  margin:16pt 0;
  overflow:hidden;
  page-break-inside:avoid;
  box-shadow:0 1pt 6pt rgba(30,58,95,.07);
}
/* Header GHE — fundo claro */
.funcao-bloco-header{
  background:linear-gradient(135deg,#eff6ff,#f0f5ff);
  padding:10pt 14pt;
  border-bottom:1.5pt solid #bfdbfe;
  display:flex;align-items:center;justify-content:space-between;gap:8pt;flex-wrap:wrap;
}
.ghe-codigo-badge{
  font-family:'IBM Plex Mono',monospace;font-size:9.5pt;font-weight:700;
  background:#1e3a5f;color:#fff;padding:3pt 12pt;border-radius:5pt;
  white-space:nowrap;flex-shrink:0;letter-spacing:.02em;
}
.ghe-funcoes{font-size:8.5pt;color:#374151;margin-top:4pt;line-height:1.4;}
.ghe-funcoes strong{color:#0d2040;font-weight:700;}
.ghe-count{font-size:8pt;color:#4b5563;white-space:nowrap;flex-shrink:0;font-weight:600;}
.funcao-bloco-nome{font-size:11pt;font-weight:700;color:#ffffff;}
.funcao-bloco-cbo{font-size:8pt;color:#93c5fd;font-family:'IBM Plex Mono',monospace;}
.funcao-bloco-setores{font-size:8pt;color:#bfdbfe;background:rgba(255,255,255,.12);padding:2pt 8pt;border-radius:10pt;border:1pt solid rgba(255,255,255,.2);}

/* Card de risco — nova hierarquia visual */
.risco-funcao{border-bottom:1pt solid #f1f5f9;padding:11pt 14pt;}
.risco-funcao:last-child{border-bottom:none;}

/* Linha 1: contexto (categoria + perigo) */
.risco-ctx{display:flex;align-items:center;gap:6pt;margin-bottom:4pt;flex-wrap:wrap;}
.risco-cat-pill{font-size:7pt;padding:2pt 8pt;border-radius:4pt;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
.risco-perigo-pill{font-size:7.5pt;color:#4b5563;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280pt;font-weight:500;}

/* Linha 2: protagonista (nome + nível) */
.risco-principal{display:flex;align-items:flex-start;justify-content:space-between;gap:8pt;margin-bottom:5pt;}
.risco-funcao-nome{font-size:11pt;font-weight:700;color:#0d2040;flex:1;line-height:1.3;}
.nivel-pill{font-size:7.5pt;padding:3pt 11pt;border-radius:5pt;font-weight:700;white-space:nowrap;flex-shrink:0;margin-top:1pt;letter-spacing:.02em;}
.nivel-MUITO-ALTO{background:#fee2e2;color:#991b1b;}
.nivel-ALTO{background:#ffedd5;color:#9a3412;}
.nivel-MEDIO{background:#fef9c3;color:#854d0e;}
.nivel-BAIXO{background:#dcfce7;color:#166534;}

/* Linha 3: métricas compactas */
.risco-metricas{font-size:8pt;color:#4b5563;margin-bottom:5pt;}
.risco-metricas strong{color:#374151;}

/* Linha 4: informações técnicas discretas */
.risco-tecnico{font-size:8pt;color:#4b5563;line-height:1.6;margin-bottom:4pt;border-left:2pt solid #c7d7f9;padding-left:7pt;}
.risco-tecnico b{color:#374151;font-weight:600;}

/* Linha 5: danos à saúde */
.risco-danos-texto{font-size:8.5pt;color:#1f2937;line-height:1.5;margin-bottom:6pt;padding:5pt 10pt;background:#fff7ed;border-left:3pt solid #fb923c;border-radius:0 4pt 4pt 0;}
.risco-danos-label{font-size:7pt;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9a3412;margin-bottom:3pt;}

/* Linha 6: medidas */
.risco-funcao-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6pt;margin-bottom:6pt;}
.rf-field .lbl{font-size:7pt;color:#6b7280;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3pt;}
.rf-field .val{font-size:9pt;color:#1f2937;font-weight:500;}
.danos-box{background:#fff7ed;border-left:3pt solid #fb923c;padding:5pt 8pt;margin-bottom:5pt;border-radius:0 3pt 3pt 0;}
.danos-label{font-size:7pt;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9a3412;margin-bottom:3pt;}
.danos-text{font-size:8.5pt;color:#1f2937;line-height:1.5;}

.medidas-box{margin-top:6pt;padding-top:6pt;border-top:1pt solid #f3f4f6;}
.medidas-label{font-size:7.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#4b5563;margin-bottom:5pt;}
.medida-item{display:flex;gap:7pt;align-items:flex-start;margin-bottom:4pt;}
.medida-num{width:15pt;height:15pt;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7.5pt;font-weight:700;flex-shrink:0;}
.medida-label{font-size:8pt;font-weight:700;width:68pt;flex-shrink:0;padding-top:0pt;}
.medida-desc{font-size:8.5pt;color:#1f2937;flex:1;line-height:1.45;}
.medida-vazio{font-size:8pt;color:#6b7280;font-style:italic;}

/* ── MATRIZ EPI ── */
.epi-matrix-table{width:100%;border-collapse:collapse;font-size:9pt;margin:8pt 0;}
.epi-matrix-table th{background:#0d2040;color:#fff;padding:6pt 8pt;font-size:8pt;font-weight:600;text-transform:uppercase;letter-spacing:.03em;text-align:left;}
.epi-matrix-table td{padding:6pt 8pt;border-bottom:1pt solid #e5e7eb;vertical-align:top;color:#1f2937;}
.epi-matrix-table tr:nth-child(even) td{background:#f9fafb;}
.epi-pill{display:inline-block;background:#ede9fe;color:#4c1d95;border:1pt solid #c4b5fd;border-radius:4pt;padding:2pt 7pt;font-size:7.5pt;font-weight:600;margin:1pt 2pt 1pt 0;}
.ca-pill{display:inline-block;background:#f3f4f6;color:#1f2937;border:1pt solid #d1d5db;border-radius:4pt;padding:1pt 6pt;font-size:7pt;font-family:'IBM Plex Mono',monospace;font-weight:500;}

/* ── SEÇÕES EM BREVE ── */
.em-breve{background:#f9fafb;border:1pt dashed #d1d5db;border-radius:4pt;padding:16pt;text-align:center;margin:10pt 0;}
.em-breve-icon{font-size:20pt;margin-bottom:6pt;}
.em-breve-label{font-size:9pt;color:#6b7280;font-style:italic;}

/* ── PRINT ── */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  body{background:#fff!important;margin:0!important;padding:0!important;}
  .screen-header{display:none!important;}
  .screen-body{padding:0!important;display:block!important;}
  .pages-wrap{gap:0!important;display:block!important;align-items:unset!important;}

  @page{size:A4;margin:0;}

  /* Cada .page = uma página A4 exata */
  .page{
    box-shadow:none!important;
    margin:0!important;
    width:210mm!important;
    height:297mm!important;
    min-height:unset!important;
    max-height:unset!important;
    overflow:hidden!important;
    padding:14mm 16mm 28mm 22mm!important;
    border-left:8mm solid #0d2040!important;
    page-break-after:always!important;
    break-after:page!important;
    page-break-before:auto!important;
    position:relative!important;
    box-sizing:border-box!important;
  }
  .page::before{display:none!important;}
  .page:last-child{page-break-after:auto!important;break-after:auto!important;}

  /* Rodapé fixo no fundo de cada página — 12mm de base */
  .page-footer{
    position:absolute!important;
    bottom:10mm!important;
    left:22mm!important;
    right:16mm!important;
    margin-top:0!important;
    border-top:1pt solid #d1d5db!important;
    padding-top:5pt!important;
    display:flex!important;
    justify-content:space-between!important;
    align-items:center!important;
    background:#fff!important;
    height:12mm!important;
    overflow:hidden!important;
  }

  /* Numeração de página — exibe exatamente o texto definido pelo JS */
  .pf-page{
    font-size:8pt!important;
    color:#6b7280!important;
    font-family:'IBM Plex Mono',monospace!important;
  }

  /* Evita corte de elementos */
  .funcao-bloco{page-break-inside:avoid;break-inside:avoid;}
  .risco-funcao{page-break-inside:avoid;break-inside:avoid;}
  .danos-box{page-break-inside:avoid;break-inside:avoid;}
  .medidas-box{page-break-inside:avoid;break-inside:avoid;}
  .ficha-grid{page-break-inside:avoid;break-inside:avoid;}
  .capa-rodape-bloco{page-break-inside:avoid;break-inside:avoid;}
  .capa-elab-strip{page-break-inside:avoid;break-inside:avoid;}
  .risco-danos-texto{page-break-inside:avoid;break-inside:avoid;}
  .epi-matrix-table tr{page-break-inside:avoid;break-inside:avoid;}

  /* Títulos de seção nunca ficam sozinhos no fim da página */
  .doc-section{page-break-after:avoid;break-after:avoid;}
  .doc-subsection{page-break-after:avoid;break-after:avoid;}
  .funcao-bloco-header{page-break-after:avoid;break-after:avoid;}
  .page-header{page-break-after:avoid;break-after:avoid;}

  /* Tabelas — evitar linhas isoladas */
  .doc-table tr{page-break-inside:avoid;break-inside:avoid;}
  .epi-matrix-table{page-break-inside:auto;}

  /* Grid responsivo para impressão */
  .risco-funcao-grid{grid-template-columns:repeat(2,1fr)!important;}

  /* Sumário não quebra */
  .doc-table.sumario{page-break-inside:avoid;break-inside:avoid;}

  /* Agentes badge sempre legíveis */
  .agente-badge{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important;}
  .risco-cat-pill{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important;}
  .capa-badge{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important;}
  .funcao-bloco-header{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important;}
  .capa-divider{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important;}

  /* Badges legíveis em impressão P&B */
  .nivel-MUITO-ALTO{background:#fff!important;color:#991b1b!important;border:1.5pt solid #991b1b!important;font-weight:700!important;}
  .nivel-ALTO{background:#fff!important;color:#9a3412!important;border:1.5pt solid #9a3412!important;font-weight:700!important;}
  .nivel-MEDIO{background:#fff!important;color:#854d0e!important;border:1.5pt solid #854d0e!important;font-weight:700!important;}
  .nivel-BAIXO{background:#fff!important;color:#166534!important;border:1.5pt solid #166534!important;font-weight:700!important;}

  /* Capa limitada a 1 página */
  .capa{max-height:257mm!important;overflow:hidden!important;}

  /* Tabelas sem overflow */
  .doc-table td{word-break:break-word;overflow-wrap:break-word;}
  .doc-table{font-size:9pt!important;}

  /* Ocultar containers de medição */
  [style*="left:-9999px"]{display:none!important;}

  /* Contraste reforçado para impressão — tudo legível em P&B */
  .pf-label,.pf-page{color:#374151!important;}
  .ph-doc{color:#4b5563!important;}
  .ph-empresa{color:#0d2040!important;}
  .risco-perigo-pill{color:#374151!important;}
  .ghe-count{color:#374151!important;}
  .ghe-funcoes{color:#1f2937!important;}
  .risco-tecnico{color:#1f2937!important;}
  .risco-metricas{color:#1f2937!important;}
  .ficha-label{color:#4b5563!important;}
  .ficha-value{color:#0d2040!important;}
  .medidas-label,.rf-field .lbl{color:#374151!important;}
  .medida-desc{color:#0d2040!important;}
  .medida-label{color:#0d2040!important;}
  .danos-text{color:#0d2040!important;}
  .capa-footer-label{color:#374151!important;}
  .capa-footer-value{color:#0d2040!important;}
  .capa-elab-strip-label{color:#374151!important;}
  .capa-elab-strip-nome{color:#0d2040!important;}
  .capa-elab-strip-cnpj{color:#374151!important;}
  .em-breve-label{color:#4b5563!important;}
  .doc-text{color:#0d2040!important;}
  .setor-detalhe-nome{color:#0d2040!important;}
  .epi-pill{color:#3b0764!important;background:#f3e8ff!important;}
  .ca-pill{color:#0d2040!important;background:#f3f4f6!important;}
  /* Todos os inline color:#6b7280 que são texto de conteúdo */
  [style*="color:#6b7280"]{color:#374151!important;}
  [style*="color: #6b7280"]{color:#374151!important;}
  .ficha-item{page-break-inside:avoid;break-inside:avoid;}
  .setor-detalhe{page-break-inside:avoid;break-inside:avoid;}
  .doc-table{page-break-inside:auto;}
  .doc-table tr{page-break-inside:avoid;break-inside:avoid;}
  .doc-table thead{display:table-header-group;}
  .doc-subsection{page-break-after:avoid;break-after:avoid;}

<script>
const SUPA_URL='https://ookqdukeulwcnhilbgbo.supabase.co';
const SUPA_KEY='sb_publishable_l9NggU-e1bgt7CnrYUWo4w_AMoaJa2e';
const token=localStorage.getItem('sgs_token');
if(!token)window.location.href='login.html';
const params=new URLSearchParams(window.location.search);

let empresa,cnaes,setores,funcoes,funcaoSetores,setor_riscos,funcao_riscos,

function escHtml(s){const str=s===null||s===undefined?'':(s+'');return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

];

function headers(){return{'apikey':SUPA_KEY,'Authorization':`Bearer ${token}`};}

async function carregar(){
  try{
    const [resEmp,resCnaes,resSets,resFuncs,resFuncSets,resRiscos,resCats,resEpis,resPerigos]=await Promise.all([
      fetch(`${SUPA_URL}/rest/v1/empresas?id=eq.${empresaId}&select=*`,{headers:headers()}),
      fetch(`${SUPA_URL}/rest/v1/empresa_cnaes?empresa_id=eq.${empresaId}&select=*&order=tipo.asc`,{headers:headers()}),
      fetch(`${SUPA_URL}/rest/v1/setores?empresa_id=eq.${empresaId}&ativo=eq.true&select=*&order=nome_setor.asc`,{headers:headers()}),
      fetch(`${SUPA_URL}/rest/v1/funcoes?empresa_id=eq.${empresaId}&ativo=eq.true&select=*&order=nome_funcao.asc`,{headers:headers()}),
      fetch(`${SUPA_URL}/rest/v1/funcao_setores?ativo=eq.true&select=funcao_id,setor_id,num_funcionarios_previsto`,{headers:headers()}),
      fetch(`${SUPA_URL}/rest/v1/riscos?ativo=eq.true&select=*`,{headers:headers()}),
      fetch(`${SUPA_URL}/rest/v1/categorias_risco?ativo=eq.true&select=*`,{headers:headers()}),
      fetch(`${SUPA_URL}/rest/v1/catalogo_epis?ativo=eq.true&select=id,nome,categoria`,{headers:headers()}),
      fetch(`${SUPA_URL}/rest/v1/perigos?ativo=eq.true&select=id,nome,descricao,categoria_risco_id`,{headers:headers()}),
    ]);

    [empresa,cnaes,setores,funcoes,funcaoSetores,riscos,categorias,epis,perigos]=await Promise.all([
      resEmp.json().then(d=>d[0]),
      resCnaes.json(),resSets.json(),resFuncs.json(),resFuncSets.json(),
      resRiscos.json(),resCats.json(),resEpis.json(),resPerigos.json(),
    ]);

    // Busca setor_riscos e funcao_riscos filtrados pela empresa (via setores)
    const setorIds=setores.map(s=>s.id);
    const funcaoIds=funcoes.map(f=>f.id);

    if(setorIds.length){
      const [resSR,resMedS]=await Promise.all([
        fetch(`${SUPA_URL}/rest/v1/setor_riscos?setor_id=in.(${setorIds.join(',')})&ativo=eq.true&select=*`,{headers:headers()}),
        fetch(`${SUPA_URL}/rest/v1/setor_risco_medidas?ativo=eq.true&select=*`,{headers:headers()}),
      ]);
      setor_riscos=await resSR.json();
      medidas_setor=await resMedS.json();
    }else{setor_riscos=[];medidas_setor=[];}

    if(funcaoIds.length){
      const resFR=await fetch(`${SUPA_URL}/rest/v1/funcao_riscos?funcao_id=in.(${funcaoIds.join(',')})&ativo=eq.true&select=*`,{headers:headers()});
      funcao_riscos=await resFR.json();
      if(funcao_riscos.length){
        const frIds=funcao_riscos.map(fr=>fr.id).join(',');

        medidas_funcao=await resMedF.json();
      }else{medidas_funcao=[];}
    }else{funcao_riscos=[];medidas_funcao=[];}

    // SESMT
    const resSesmtCalc=await fetch(`${SUPA_URL}/rest/v1/rpc/calcular_sesmt_empresa`,{
      method:'POST',headers:{'Content-Type':'application/json',...headers()},
      body:JSON.stringify({p_empresa_id:parseInt(empresaId)})
    });
    window.sesmtCalc=await resSesmtCalc.json();

    const resSesmt=await fetch(`${SUPA_URL}/rest/v1/dimensionamento_sesmt?empresa_id=eq.${empresaId}&select=*&limit=1`,{headers:headers()});
    const sesmtArr=await resSesmt.json();
    window.sesmtData=sesmtArr[0]||null;

    // Ações
    const resAcoes=await fetch(`${SUPA_URL}/rest/v1/acoes?empresa_id=eq.${empresaId}&ativo=eq.true&select=*&order=prioridade.asc,prazo.asc`,{headers:headers()});
    window.acoesData=await resAcoes.json();

    // Campanhas psicossociais encerradas com resultados
    const resCampanhas=await fetch(`${SUPA_URL}/rest/v1/campanhas_psicossocial?empresa_id=eq.${empresaId}&status=eq.Encerrada&ativo=eq.true&select=*&order=data_fim.desc`,{headers:headers()});
    window.campanhasPsi=await resCampanhas.json();
    if(window.campanhasPsi.length){
      const campIds=window.campanhasPsi.map(c=>c.id).join(',');
      const resCF=await fetch(`${SUPA_URL}/rest/v1/campanha_funcoes?campanha_id=in.(${campIds})&ativo=eq.true&select=*`,{headers:headers()});
      window.campanhaFuncoesPsi=await resCF.json();
      if(window.campanhaFuncoesPsi.length){

        window.resultadosPsi=await resRes.json();
        const resNr01=await fetch(`${SUPA_URL}/rest/v1/checklist_nr01_resultados?campanha_funcao_id=in.(${cfIds})&select=*`,{headers:headers()});
        window.resultadosNr01=await resNr01.json();
      }else{window.resultadosPsi=[];window.resultadosNr01=[];}
    }else{window.campanhaFuncoesPsi=[];window.resultadosPsi=[];window.resultadosNr01=[];}


    // Contratadas, Participação e Versões
    const [resContrat, resPartic, resVersoes, resGheNomes, resAcidentes] = await Promise.all([
      fetch(`${SUPA_URL}/rest/v1/empresa_contratadas?empresa_id=eq.${empresaId}&ativo=eq.true&select=*&order=razao_social.asc`,{headers:headers()}),
      fetch(`${SUPA_URL}/rest/v1/pgr_participacao?empresa_id=eq.${empresaId}&select=*&limit=1`,{headers:headers()}),
      fetch(`${SUPA_URL}/rest/v1/pgr_versoes?empresa_id=eq.${empresaId}&select=*&order=criado_em.asc`,{headers:headers()}),
      fetch(`${SUPA_URL}/rest/v1/ghe_nomes?empresa_id=eq.${empresaId}&select=codigo,nome`,{headers:headers()}),
      fetch(`${SUPA_URL}/rest/v1/empresa_historico_acidentes?empresa_id=eq.${empresaId}&ativo=eq.true&select=*&order=data_ocorrencia.desc`,{headers:headers()}),
    ]);
    const rawContrat = await resContrat.json();
    window.contratadas = Array.isArray(rawContrat) ? rawContrat : [];

    const rawPartic = await resPartic.json();
    const particArr = Array.isArray(rawPartic) ? rawPartic : [];
    window.pgrParticipacao = particArr[0] || null;

    const rawVersoes = await resVersoes.json();
    window.pgrVersoes = Array.isArray(rawVersoes) ? rawVersoes : [];
    const rawGheNomes = await resGheNomes.json().catch(()=>[]);
    window.gheNomes={};
    (Array.isArray(rawGheNomes)?rawGheNomes:[]).forEach(g=>{window.gheNomes[g.codigo]=g.nome||'';});
    window.historicoAcidentes=await resAcidentes.json().catch(()=>[]);

    renderDocumento();
  }catch(e){
    document.getElementById('pages-wrap').innerHTML=`<div style="color:#e05555;text-align:center;padding:40px;">Erro ao carregar: ${e.message}</div>`;
    console.error(e);
  }
}

    ${phHeader('7. Avaliação de Riscos Psicossociais')}

      <div style="display:flex;align-items:center;gap:10pt;margin-bottom:10pt;">
        <span style="font-size:18pt;line-height:1;">⚠️</span>
        <div style="font-size:11pt;font-weight:700;color:#92400e;">Avaliação Psicossocial — Pendente</div>

        para esta empresa até a data de elaboração deste documento.
      </p>
      <div style="background:#fff8ed;border-left:3pt solid #f59e0b;padding:8pt 12pt;border-radius:0 4pt 4pt 0;">
        <div style="font-size:8pt;font-weight:700;color:#92400e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4pt;">Ação necessária</div>
        <p class="doc-text" style="margin-bottom:0;color:#374151;">Realize e encerre uma campanha de avaliação psicossocial (COPSOQ-III Média ou Checklist NR-01) no módulo Psicossocial do SGS. Os resultados serão integrados automaticamente a este documento na próxima geração.</p>
      </div>
    </div>
    ${pfFooter()}`;
    pgsPsi.push(pgPend);wrap.appendChild(pgPend);
  }
  pgsPlano.forEach(pg=>wrap.appendChild(pg));
  if(pgContrat)wrap.appendChild(pgContrat);
  if(pgPartic)wrap.appendChild(pgPartic);
  if(pgVersoes)wrap.appendChild(pgVersoes);

  // Numeração de páginas
  const paginas=Array.from(document.querySelectorAll('#pages-wrap .page'));
  paginas.forEach((pg,i)=>{
    const numEl=pg.querySelector('.pf-page');
    if(numEl)numEl.textContent=`Pág. ${i+1}`;
    const primSec=pg.querySelector('.doc-section');
    if(primSec)primSec.classList.add('primeira-secao');
  });

  // Atualiza sumário com páginas reais
  function nrPag(el){const idx=paginas.indexOf(el);return idx>=0?String(idx+1):'—';}
  const setPg=(id,n)=>{const el=document.getElementById(id);if(el)el.textContent=n;};
  setPg('sumario-1',pgsIdent.length?nrPag(pgsIdent[0]):'—');
  setPg('sumario-2',pgsCaract.length?nrPag(pgsCaract[0]):'—');
  setPg('sumario-3',nrPag(pgSesmt));
  setPg('sumario-3b',pgsMatriz.length?nrPag(pgsMatriz[0]):'—');
  const nrInv=pgsInv.length?nrPag(pgsInv[0]):'—';
  setPg('sumario-4',nrInv);setPg('sumario-41',nrInv);setPg('sumario-42',nrInv);setPg('sumario-43',nrInv);setPg('sumario-44',nrInv);
  setPg('sumario-5',nrPag(pgEpi));
  setPg('sumario-6',pgsPsi.length?nrPag(pgsPsi[0]):'—');
  setPg('sumario-7',pgsPlano.length?nrPag(pgsPlano[0]):'—');
  // Monitoramento está na última página do plano
  setPg('sumario-8',pgsPlano.length?nrPag(pgsPlano[pgsPlano.length-1]):'—');
  if(pgContrat)setPg('sumario-9',nrPag(pgContrat));
  if(pgPartic)setPg('sumario-10',nrPag(pgPartic));
  if(pgVersoes)setPg('sumario-11',nrPag(pgVersoes));
}

function renderCaracterizacao(){
  const ALTURA_UTIL_PX=210*96/25.4;
  const cont=document.createElement('div');
  cont.style.cssText=`position:absolute;left:-9999px;top:0;width:168mm;font-family:'IBM Plex Sans',sans-serif;font-size:10pt;line-height:1.5;`;
  document.body.appendChild(cont);
  const medir=html=>{cont.innerHTML=html;return cont.getBoundingClientRect().height;};

  const funcoesPorSetor={};
  funcaoSetores.forEach(fs=>{
    if(!funcoesPorSetor[fs.setor_id])funcoesPorSetor[fs.setor_id]=[];
    const f=funcoes.find(x=>x.id===fs.funcao_id);
    if(f)funcoesPorSetor[fs.setor_id].push(f.nome_funcao);
  });

  function agentesSetor(s){
    const mapa=[
      {key:'tem_agente_fisico',label:'Físico',cls:'agente-fisico'},
      {key:'tem_agente_quimico',label:'Químico',cls:'agente-quimico'},
      {key:'tem_agente_biologico',label:'Biológico',cls:'agente-biologico'},
      {key:'tem_agente_ergonomico',label:'Ergonômico',cls:'agente-ergonomico'},
      {key:'tem_agente_acidente',label:'Acidente',cls:'agente-acidente'},
      {key:'tem_agente_psicossocial',label:'Psicossocial',cls:'agente-psicossocial'},
    ];
    return mapa.filter(a=>s[a.key]).map(a=>`<span class="agente-badge ${a.cls}">${a.label}</span>`).join('');
  }

  function gerarSetorHtml(s){
    const fns=funcoesPorSetor[s.id]||[];
    const badges=agentesSetor(s);
    const detalhes=[];
    if(s.descricao)detalhes.push(`<div class="rf-field"><div class="lbl">Descrição</div><div class="val" style="font-size:8.5pt;">${h(s.descricao)}</div></div>`);
    if(s.responsavel_setor)detalhes.push(`<div class="rf-field"><div class="lbl">Responsável</div><div class="val">${h(s.responsavel_setor)}</div></div>`);
    if(s.andar)detalhes.push(`<div class="rf-field"><div class="lbl">Localização</div><div class="val">${h(s.andar)}</div></div>`);
    if(s.area_m2)detalhes.push(`<div class="rf-field"><div class="lbl">Área</div><div class="val">${h(String(s.area_m2))} m²</div></div>`);
    return`<div class="setor-detalhe">
      <div class="setor-detalhe-header">
        <div>
          <div class="setor-detalhe-nome">${h(s.nome_setor)}</div>
          ${fns.length?`<div style="font-size:8pt;color:#374151;margin-top:2pt;font-weight:500;">Funções: ${h(fns.join(' · '))}</div>`:''}
        </div>
        <div style="text-align:right;">
          <div style="font-size:8pt;color:#374151;margin-bottom:4pt;font-weight:500;">${s.num_funcionarios_previsto||0} trabalhador(es)</div>
          ${badges?`<div>${badges}</div>`:''}
        </div>
      </div>
      ${detalhes.length?`<div class="setor-detalhe-body">${detalhes.join('')}</div>`:''}
    </div>`;
  }

  function gerarFuncaoHtml(f){
    const setoresNomes=funcaoSetores.filter(fs=>fs.funcao_id===f.id).map(fs=>setores.find(s=>s.id===fs.setor_id)?.nome_setor).filter(Boolean);
    const numTrab=funcaoSetores.filter(fs=>fs.funcao_id===f.id).reduce((acc,fs)=>acc+(fs.num_funcionarios_previsto||0),0)||f.num_funcionarios_previsto||0;
    return`<div class="setor-detalhe" style="margin-bottom:8pt;">
      <div class="setor-detalhe-header">
        <div>
          <div class="setor-detalhe-nome">${h(f.nome_funcao)}</div>
          <div style="display:flex;gap:8pt;margin-top:3pt;flex-wrap:wrap;">
            ${f.cbo?`<span style="font-size:7.5pt;font-family:'IBM Plex Mono',monospace;background:#eff6ff;color:#1e40af;padding:2pt 7pt;border-radius:4pt;border:1pt solid #bfdbfe;font-weight:600;">CBO ${h(f.cbo)}</span>`:''}
            ${f.turno?`<span style="font-size:7.5pt;background:#f1f5f9;color:#1f2937;padding:2pt 7pt;border-radius:4pt;border:1pt solid #d1d5db;font-weight:500;">Turno: ${h(f.turno)}</span>`:''}
            ${f.escolaridade_minima?`<span style="font-size:7.5pt;background:#f1f5f9;color:#1f2937;padding:2pt 7pt;border-radius:4pt;border:1pt solid #d1d5db;font-weight:500;">Escolaridade: ${h(f.escolaridade_minima)}</span>`:''}
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          ${setoresNomes.length?`<div style="font-size:8.5pt;color:#1e40af;margin-bottom:3pt;font-weight:600;">Setor(es): ${h(setoresNomes.join(' · '))}</div>`:''}
          <div style="font-size:8pt;color:#374151;font-weight:500;">${numTrab} trabalhador(es)</div>
        </div>
      </div>
      ${f.descricao?`<div style="padding:10pt 12pt;border-top:1pt solid #e5e7eb;background:#fafbfc;">
        <div style="font-size:7pt;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#4b5563;margin-bottom:4pt;">Descrição da função</div>
        <div style="font-size:9pt;color:#1f2937;line-height:1.6;">${h(f.descricao)}</div>
      </div>`:''}
    </div>`;
  }

  const paginas=[];
  let paginaAtual=criarPagina();
  let htmlAtual='';
  let alturaUsada=0;
  function fecharPagina(){paginaAtual.innerHTML=htmlAtual+pfFooter();paginas.push(paginaAtual);}
  function novaPagina(){paginaAtual=criarPagina();htmlAtual=phHeader();alturaUsada=60;}
  function adicionar(html){const ha=medir(html);if(alturaUsada+ha>ALTURA_UTIL_PX){fecharPagina();novaPagina();}htmlAtual+=html;alturaUsada+=ha;}

  const introHtml=`${phHeader()}
  <div class="doc-section"><span class="num-secao">2</span>Caracterização do Estabelecimento</div>
  <div class="ficha-grid ficha-grid-3">
    <div class="ficha-item"><div class="ficha-label">Trabalhadores cobertos</div><div class="ficha-value" style="font-size:16pt;color:#0d2040;font-weight:700;">${empresa.total_funcionarios_previsto||0}</div></div>
    <div class="ficha-item"><div class="ficha-label">Setores de trabalho</div><div class="ficha-value" style="font-size:16pt;color:#2a5298;font-weight:700;">${setores.length}</div></div>
    <div class="ficha-item"><div class="ficha-label">Funções mapeadas</div><div class="ficha-value" style="font-size:16pt;color:#2a5298;font-weight:700;">${funcoes.length}</div></div>
  </div>`;
  htmlAtual=introHtml;alturaUsada=medir(introHtml);

  adicionar(`<div class="doc-subsection" style="margin-top:14pt;">Detalhamento dos setores</div>`);
  setores.forEach(s=>adicionar(gerarSetorHtml(s)));
  if(funcoes.length){
    // Anti-órfão: título + primeira função na mesma página
    const tituloHtml=`<div class="doc-subsection" style="margin-top:14pt;">Quadro de funções</div>`;
    const altTitulo=medir(tituloHtml);
    const altPrimeira=medir(gerarFuncaoHtml(funcoes[0]));
    if(alturaUsada+altTitulo+altPrimeira>ALTURA_UTIL_PX){fecharPagina();novaPagina();}
    htmlAtual+=tituloHtml;alturaUsada+=altTitulo;
    funcoes.forEach(f=>adicionar(gerarFuncaoHtml(f)));
  }
  else{adicionar(`<div class="em-breve"><div class="em-breve-icon">👷</div><div class="em-breve-label">Nenhuma função cadastrada.</div></div>`);}

  fecharPagina();
  document.body.removeChild(cont);
  return paginas;
}

function renderSESMT(){

  const enf=calc.find(c=>c.cargo?.includes('Enfermeiro')&&!c.cargo?.includes('Aux'))?.qtd||sesmt?.enfermeiro||0;
  const aux=calc.find(c=>c.cargo?.includes('Auxiliar'))?.qtd||sesmt?.aux_enfermagem||0;

  const requerCipa=calc.some(c=>c.cargo?.includes('CIPA')&&!c.cargo?.includes('CIPATR'))||sesmt?.requer_cipa||false;
  const requerCipatr=calc.some(c=>c.cargo?.includes('CIPATR'))||sesmt?.requer_cipatr||false;
  const membrosCipa=calc.find(c=>c.cargo?.includes('CIPA')&&!c.cargo?.includes('CIPATR'))?.qtd||sesmt?.numero_membros_cipa||0;
  const membrosCipatr=calc.find(c=>c.cargo?.includes('CIPATR'))?.qtd||sesmt?.numero_membros_cipatr||0;
  const grLabels={1:'GR 1 — Baixo',2:'GR 2 — Médio-Baixo',3:'GR 3 — Médio-Alto',4:'GR 4 — Alto'};

// ── GHE — GRUPOS HOMOGÊNEOS DE EXPOSIÇÃO ──────────────────────
function calcularGHEs(){
  const funcoesComRiscos=funcoes.filter(f=>funcao_riscos.some(fr=>fr.funcao_id===f.id));
  const grupos={};
  funcoesComRiscos.forEach(f=>{
    const frs=funcao_riscos.filter(fr=>fr.funcao_id===f.id);
    // Assinatura: conjunto ordenado de risco_id:nivel_risco
    const sig=frs.map(fr=>`${fr.risco_id}:${fr.nivel_risco||''}`).sort().join('|');
    if(!grupos[sig])grupos[sig]={funcoes:[],frs:frs,sig};
    grupos[sig].funcoes.push(f);
  });
  let n=1;
  return Object.values(grupos).map(g=>{
    const codigo=`GHE-${String(n++).padStart(2,'0')}`;
    return{codigo,funcoes:g.funcoes,frs:g.frs,nome:(window.gheNomes||{})[codigo]||''};
  });
}

    const altH=medir(blocoHeaderHtml+'</div>');
    if(alturaUsada+altH>ALTURA_UTIL_PX){fecharPagina();novaPagina();}
    htmlAtual+=blocoHeaderHtml;
    alturaUsada+=altH;
    return altH;
  }

  // Intro
  const introHtml=`${phHeader()}
  <div class="doc-section" style="margin-top:0;"><span class="num-secao">4</span>Inventário de Riscos Ocupacionais por GHE</div>
  <p class="doc-text" style="margin-bottom:12pt;">O inventário a seguir apresenta os perigos identificados e os riscos associados, organizados por Grupo Homogêneo de Exposição (GHE), conforme NR-01 e critério AIHA. Cada GHE reúne funções com exposição idêntica aos mesmos agentes de risco. Os riscos psicossociais são detalhados em seção específica, conforme NR-01 (Portaria MTE nº 1.419/2024).</p>`;
  htmlAtual=introHtml;
  alturaUsada=medir(introHtml);

  ghes.forEach(ghe=>{
    const frsRepresentativos=[...new Map(ghe.frs.map(fr=>[fr.risco_id,fr])).values()];

    // Anti-órfão: mede header + primeiro risco juntos; se não couber, quebra página antes
    const headerHtml=`<div class="funcao-bloco"><div class="funcao-bloco-header">${gerarGHEHeaderInner(ghe,false)}</div>`;
    const primeiroRiscoHtml=frsRepresentativos.length?gerarRiscoHtml(frsRepresentativos[0]):'';
    const altCombinado=medir(headerHtml+primeiroRiscoHtml+'</div>');
    if(alturaUsada+altCombinado>ALTURA_UTIL_PX){fecharPagina();novaPagina();}

    abrirBlocoGHE(ghe,false);

    frsRepresentativos.forEach(fr=>{
      const riscoHtml=gerarRiscoHtml(fr);
      if(!riscoHtml)return;
      const altR=medir(riscoHtml);
      if(alturaUsada+altR>ALTURA_UTIL_PX){
        htmlAtual+='</div>';
        fecharPagina();
        novaPagina();
        abrirBlocoGHE(ghe,true);
      }
      htmlAtual+=riscoHtml;
      alturaUsada+=altR;
    });

    htmlAtual+='</div>';
  });

  fecharPagina();
  document.body.removeChild(container);
  return paginas;
}

// ── MATRIZ EPI POR FUNÇÃO ─────────────────────────────────────
function renderMatrizEPI(){
  const pg=criarPagina();

  // Monta EPIs por funcao_id
  const episPorFuncao={};
  funcao_riscos.forEach(fr=>{
    const mds=medidas_funcao.filter(m=>m.funcao_risco_id===fr.id&&m.nivel==='EPI');
    if(!mds.length)return;
    if(!episPorFuncao[fr.funcao_id])episPorFuncao[fr.funcao_id]=[];
    mds.forEach(m=>{
      if(!episPorFuncao[fr.funcao_id].find(x=>x.epi_id===m.epi_id&&x.epi_nome===m.epi_nome))
        episPorFuncao[fr.funcao_id].push({epi_id:m.epi_id,epi_nome:m.epi_nome,ca:m.ca,validade_ca:m.validade_ca});
    });
  });

  // Calcula GHEs e consolida EPIs por grupo
  const ghes=calcularGHEs();
  const ghesComEpi=ghes.filter(ghe=>ghe.funcoes.some(f=>episPorFuncao[f.id]?.length));

  if(!ghesComEpi.length){
    pg.innerHTML=`
    ${phHeader()}
    <div class="doc-section"><span class="num-secao">5</span>Matriz de EPI por GHE</div>
    <div class="em-breve">
      <div class="em-breve-icon">🛡️</div>
      <div class="em-breve-label">Nenhum EPI vinculado às funções ainda.<br>Adicione EPIs nos riscos do módulo de Gestão de Riscos para gerar esta matriz.</div>
    </div>
    ${pfFooter()}`;
    return pg;
  }

  const linhasTabela=ghesComEpi.map(ghe=>{
    const episGhe=[];
    ghe.funcoes.forEach(f=>{
      (episPorFuncao[f.id]||[]).forEach(e=>{
        if(!episGhe.find(x=>x.epi_id===e.epi_id))episGhe.push(e);
      });
    });
    if(!episGhe.length)return'';

    const funcoesNomes=ghe.funcoes.map(f=>h(f.nome_funcao)).join(' · ');
    const pillsHtml=episGhe.map(e=>{
      const epiDados=epis.find(x=>x.id===e.epi_id);
      const nome=h(e.epi_nome||epiDados?.nome||'EPI');
      const ca=e.ca?`<span class="ca-pill">CA:${h(e.ca)}</span>`:'';
      return`<span class="epi-pill">🛡 ${nome}</span>${ca}`;
    }).join(' ');

    return`<tr>
      <td>
        <span class="ghe-codigo-badge" style="font-size:7.5pt;">${h(ghe.codigo)}</span>
        <div style="font-size:7.5pt;color:#374151;margin-top:4pt;">${funcoesNomes}</div>
      </td>
      <td style="text-align:center;font-weight:600;color:#0d2040;vertical-align:top;">${episGhe.length}</td>
      <td style="vertical-align:top;">${pillsHtml}</td>
    </tr>`;
  }).join('');

  pg.innerHTML=`
  ${phHeader()}
  <div class="doc-section"><span class="num-secao">5</span>Matriz de EPI por GHE</div>
  <p class="doc-text" style="margin-bottom:12pt;">A matriz a seguir consolida os Equipamentos de Proteção Individual (EPIs) obrigatórios por Grupo Homogêneo de Exposição, com base nos riscos identificados no inventário e nas medidas de controle conforme hierarquia da NR-1. Em conformidade com a NR-6, o empregador é responsável pelo fornecimento gratuito, orientação de uso, manutenção e substituição dos EPIs, bem como por exigir e fiscalizar seu uso correto.</p>
  <table class="epi-matrix-table">
    <thead>
      <tr>
        <th style="width:28%;">GHE / Funções</th>
        <th style="width:8%;text-align:center;">Qtd. EPIs</th>
        <th>EPIs obrigatórios (com Nº CA)</th>
      </tr>
    </thead>
    <tbody>${linhasTabela}</tbody>
  </table>
  <p class="doc-text" style="margin-top:8pt;font-size:8pt;">* EPIs com CA vencido ou sem CA não devem ser fornecidos. O empregador deve capacitar o trabalhador quanto ao uso adequado, guarda e conservação de cada EPI, conforme NR-6.</p>
  ${pfFooter()}`;
  return pg;
}

async function confirmarParticipacao(reeditar=false){
  if(reeditar&&!confirm('Remover a confirmação e permitir edição?'))return;
  const userRaw=localStorage.getItem('sgs_user');
  const user=userRaw?JSON.parse(userRaw):null;
  const h2={'apikey':SUPA_KEY,'Authorization':`Bearer ${token}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'};
  try{
    await fetch(`${SUPA_URL}/rest/v1/pgr_participacao`,{
      method:'POST',headers:h2,
      body:JSON.stringify({empresa_id:parseInt(empresaId),confirmado_em:reeditar?null:new Date().toISOString(),confirmado_por:reeditar?null:(user?.email||'—'),atualizado_em:new Date().toISOString()})
    });
    window.pgrParticipacao=window.pgrParticipacao||{};
    window.pgrParticipacao.confirmado_em=reeditar?null:new Date().toISOString();
    window.pgrParticipacao.confirmado_por=reeditar?null:(user?.email||'—');
    renderDocumento();
  }catch(e){alert('Erro ao confirmar: '+e.message);}
}

async function salvarNomeGHE(codigo,nome){
  try{
    window.gheNomes=window.gheNomes||{};
    window.gheNomes[codigo]=nome||'';
    const resCheck=await fetch(`${SUPA_URL}/rest/v1/ghe_nomes?empresa_id=eq.${empresaId}&codigo=eq.${encodeURIComponent(codigo)}&select=id`,{headers:headers()});
    const existing=await resCheck.json();
    if(existing.length){
      await fetch(`${SUPA_URL}/rest/v1/ghe_nomes?id=eq.${existing[0].id}`,{method:'PATCH',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({nome:nome||null})});
    }else{
      await fetch(`${SUPA_URL}/rest/v1/ghe_nomes`,{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({empresa_id:parseInt(empresaId),codigo,nome:nome||null})});
    }
    // Atualiza badge exibido
    document.querySelectorAll('.ghe-codigo-badge').forEach(el=>{
      if(el.textContent.startsWith(codigo)){
        el.textContent=codigo+(nome?' — '+nome:'');
      }
    });
  }catch(e){console.error('Erro ao salvar nome GHE:',e);}
}

      method:'POST',headers:h2,
      body:JSON.stringify({empresa_id:parseInt(empresaId),versao,data_revisao:new Date().toISOString().split('T')[0],autor:autor||null,descricao_alteracao:descricao||null})
    });
    renderDocumento();
  }catch(e){console.error('Erro adicionarVersao:',e);}
}

function renderPlanoAcao(){
  const todasAcoes=window.acoesData||[];
  const idsAtivos=acoesSelecionadasIds||todasAcoes.map(a=>a.id);
  const acoes=todasAcoes.filter(a=>idsAtivos.includes(a.id)&&a.status!=='Arquivada'&&a.status!=='Cancelada');
  const PRIOR_COR={'Crítica':'#991b1b','Alta':'#9a3412','Média':'#854d0e','Baixa':'#166534'};
  const PRIOR_BG={'Crítica':'#fee2e2','Alta':'#ffedd5','Média':'#fef9c3','Baixa':'#dcfce7'};
  const setoresMap={};setores.forEach(s=>{setoresMap[s.id]=s.nome_setor;});
  const funcoesMap={};funcoes.forEach(f=>{funcoesMap[f.id]=f.nome_funcao;});

  const acoesAgrupadas=[];
  const titlosVistos={};
  acoes.forEach(a=>{
    const titulo=a.titulo.trim();
    if(titlosVistos[titulo]!==undefined){
      const grupo=acoesAgrupadas[titlosVistos[titulo]];
      const setor=a.setor_id?setoresMap[a.setor_id]:null;
      const funcao=a.funcao_id?funcoesMap[a.funcao_id]:null;
      if(setor&&!grupo.vinculos.includes('📁 '+setor))grupo.vinculos.push('📁 '+setor);
      if(funcao&&!grupo.vinculos.includes('👷 '+funcao))grupo.vinculos.push('👷 '+funcao);
      const priorOrdem={Crítica:4,Alta:3,Média:2,Baixa:1};
      if((priorOrdem[a.prioridade]||0)>(priorOrdem[grupo.prioridade]||0))grupo.prioridade=a.prioridade;
      if(a.prazo&&(!grupo.prazo||a.prazo<grupo.prazo))grupo.prazo=a.prazo;
    }else{
      titlosVistos[titulo]=acoesAgrupadas.length;
      const setor=a.setor_id?setoresMap[a.setor_id]:null;
      const funcao=a.funcao_id?funcoesMap[a.funcao_id]:null;
      const vinculos=[];
      if(setor)vinculos.push('📁 '+setor);
      if(funcao)vinculos.push('👷 '+funcao);
      acoesAgrupadas.push({titulo,origem:a.origem,prioridade:a.prioridade,responsavel:a.responsavel,prazo:a.prazo,status:a.status,indicador:a.indicador||null,vinculos});
    }
  });

  const theadHtml=`<thead><tr><th style="width:36%;">Ação / Origem</th><th style="width:11%;text-align:center;">Prioridade</th><th style="width:14%;">Responsável</th><th style="width:12%;text-align:center;">Prazo</th><th style="width:13%;text-align:center;">Status</th><th style="width:14%;">Indicador</th></tr></thead>`;
  const rowHtml=a=>{
    const prior=a.prioridade||'Média';
    const prazo=a.prazo?fmtData(a.prazo):'—';
    const isCritica=prior==='Crítica';
    const badgeEmergencial=isCritica?`<span style="background:#fee2e2;color:#991b1b;border:1pt solid #fca5a5;border-radius:3pt;font-size:7pt;font-weight:700;padding:1pt 6pt;margin-left:4pt;">⚠ IMEDIATA</span>`:'';
    return`<tr${isCritica?' style="background:#fff5f5;"':''}>
      <td>
        <div style="font-weight:500;font-size:9pt;">${h(a.titulo)}${badgeEmergencial}</div>
        ${a.vinculos.length?`<div style="font-size:7pt;color:#6b7280;margin-top:2pt;">${a.vinculos.map(v=>h(v)).join(' · ')}</div>`:''}
        ${a.origem&&a.origem!=='Manual'?`<div style="font-size:7pt;color:#6b7280;margin-top:1pt;">Origem: ${h(a.origem)}</div>`:''}
      </td>
      <td style="text-align:center;"><span style="background:${PRIOR_BG[prior]||'#f3f4f6'};color:${PRIOR_COR[prior]||'#374151'};padding:2pt 6pt;border-radius:3pt;font-size:7.5pt;font-weight:600;">${h(prior)}</span></td>
      <td style="font-size:8pt;">${h(a.responsavel||'—')}</td>
      <td style="text-align:center;font-size:8pt;font-family:'IBM Plex Mono',monospace;">${prazo}</td>
      <td style="text-align:center;font-size:8pt;font-weight:600;white-space:nowrap;">${h(a.status||'Pendente')}</td>
      <td style="font-size:8pt;color:#1f2937;">${a.indicador?h(a.indicador):'<span style="color:#6b7280;">—</span>'}</td>
    </tr>`;
  };

  const monitHtml=`
  <div class="doc-section" style="margin-top:20pt;"><span class="num-secao">8</span>Monitoramento e Revisão — NR-1</div>
  <p class="doc-text">Este PGR deverá ser revisado:</p>
  <ul style="margin:8pt 0 0 0;padding:0;list-style:none;">
    ${[
      ['a cada 2 anos','revisão periódica obrigatória — NR-01 subitem 1.5.4'],
      ['após mudanças nos processos','que alterem os riscos ocupacionais'],
      ['após acidente grave, fatal','ou diagnóstico de doença ocupacional confirmada'],
      ['quando houver novos agentes de risco','identificados no ambiente de trabalho'],
      ['quando solicitado por Auditor Fiscal do Trabalho',''],
      ['quando solicitado pela CIPA ou CIPATR',''],
    ].map(([forte,resto])=>`<li style="display:flex;gap:8pt;padding:4pt 0;border-bottom:1pt solid #f3f4f6;align-items:baseline;">
      <span style="color:#2a5298;font-size:9pt;flex-shrink:0;">▸</span>
      <span class="doc-text"><strong>${forte}</strong>${resto?` — ${resto}`:''}</span>
    </li>`).join('')}
  </ul>
  <div style="margin-top:36pt;display:grid;grid-template-columns:1fr 1fr 1fr;gap:20pt;">
    ${['Elaborado por','Revisado por','Aprovado por'].map(l=>`<div style="text-align:center;">
      <div style="border-top:1pt solid #374151;padding-top:6pt;margin-top:40pt;">
        <div style="font-size:8pt;color:#6b7280;">${l}</div>
        <div style="font-size:8pt;color:#6b7280;margin-top:2pt;">Data: ___/___/______</div>
      </div>
    </div>`).join('')}
  </div>`;

  const paginas=[];
  const ROWS_FIRST=10,ROWS_CONT=15;

  if(!acoesAgrupadas.length){
    const pg=criarPagina();
    pg.innerHTML=`${phHeader()}
    <div class="doc-section"><span class="num-secao">7</span>Plano de Ação</div>
    <p class="doc-text" style="margin-bottom:12pt;">O Plano de Ação estabelece as medidas de prevenção e controle a implementar, com responsáveis, prazos e status, seguindo a hierarquia da NR-1.</p>
    <div class="em-breve"><div class="em-breve-icon">📋</div><div class="em-breve-label">Nenhuma ação selecionada.<br>Clique em "Revisar plano de ação" para selecionar.</div></div>
    ${monitHtml}
    ${pfFooter()}`;
    paginas.push(pg);
    return paginas;
  }

  const lotes=[acoesAgrupadas.slice(0,ROWS_FIRST)];
  for(let i=ROWS_FIRST;i<acoesAgrupadas.length;i+=ROWS_CONT)lotes.push(acoesAgrupadas.slice(i,i+ROWS_CONT));

  lotes.forEach((lote,idx)=>{
    const pg=criarPagina();
    const isLast=idx===lotes.length-1;
    if(idx===0){
      pg.innerHTML=`${phHeader()}
      <div class="doc-section"><span class="num-secao">7</span>Plano de Ação</div>
      <p class="doc-text" style="margin-bottom:12pt;">O Plano de Ação estabelece as medidas de prevenção e controle a implementar, com responsáveis, prazos e status, seguindo a hierarquia da NR-1.</p>
      <table class="doc-table">${theadHtml}<tbody>${lote.map(rowHtml).join('')}</tbody></table>
      ${isLast?monitHtml:''}
      ${pfFooter()}`;
    }else{
      pg.innerHTML=`${phHeader()}
      <div class="doc-subsection" style="margin-top:6pt;">Plano de Ação (continuação)</div>
      <table class="doc-table">${theadHtml}<tbody>${lote.map(rowHtml).join('')}</tbody></table>
      ${isLast?monitHtml:''}
      ${pfFooter()}`;
    }
    paginas.push(pg);
  });
  return paginas;
}

function carregarLogo(input){
  const file=input.files[0];if(!file)return;

function removerLogo(){
  elaboradora.logoUrl='';
  document.getElementById('logo-preview').innerHTML='📷<br>Logo';
  document.getElementById('btn-remover-logo').style.display='none';
  document.getElementById('elab-logo-input').value='';

function atualizarElaboradora(){
  elaboradora.nome=document.getElementById('elab-nome').value.trim();
  elaboradora.cnpj=document.getElementById('elab-cnpj').value.trim();
  elaboradora.responsavel=document.getElementById('elab-responsavel').value.trim();
  elaboradora.dataElaboracao=document.getElementById('elab-data').value||'';

  // Lógica inteligente: a elaboradora só aparece se for DIFERENTE da empresa dona
  const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'').trim();
  const empresaRS=empresa?.razao_social||'';
  const empresaFan=empresa?.nome_fantasia||'';
  const elabNormalizado=norm(elaboradora.nome);
  const elabDiferente=!!elaboradora.nome && elabNormalizado!==norm(empresaRS) && elabNormalizado!==norm(empresaFan);

  // Faixa discreta da elaboradora no rodapé da capa
  const stripEl=document.getElementById('capa-elab-strip');
  if(stripEl)stripEl.style.display=elabDiferente?'flex':'none';

  if(elabDiferente){
    const nomeEl=document.getElementById('capa-elab-strip-nome');
    if(nomeEl)nomeEl.textContent=elaboradora.nome;
    const cnpjEl=document.getElementById('capa-elab-strip-cnpj');
    if(cnpjEl)cnpjEl.textContent=elaboradora.cnpj?'CNPJ: '+elaboradora.cnpj:'';

    const logoEl=document.getElementById('doc-elab-logo');
    if(logoEl){
      if(elaboradora.logoUrl){
        logoEl.innerHTML=`<img src="${elaboradora.logoUrl}" style="width:100%;height:100%;object-fit:contain;">`;
        logoEl.style.cssText='background:#fff;';
      }else{
        const sigla=(elaboradora.nome||'SST').replace(/[^A-Z]/gi,'').slice(0,3).toUpperCase()||'SST';
        logoEl.innerHTML=`<span class="capa-elab-strip-sigla">${sigla}</span>`;
        logoEl.style.cssText='';
      }
    }
  }

  // Atualiza rodapé de elaboração (Versão / Elaboração / Revisão)
  const footerEl=document.getElementById('doc-elab-footer');
  if(footerEl)footerEl.textContent=elaboradora.responsavel||elaboradora.nome||(empresa?.nome_fantasia||empresa?.razao_social||'—');
}

// ── PLANO DE AÇÃO MODAL ───────────────────────────────────────
function abrirModalPlanoAcao(){
  const acoes=window.acoesData||[];
  if(!acoes.length){alert('Nenhuma ação cadastrada.');return;}
  const PRIOR_COR={'Crítica':'#e05555','Alta':'#e0a855','Média':'#7aabf7','Baixa':'#2dd4a0'};
  const STATUS_COR={'Pendente':'#545e72','Em andamento':'#4a7cdc','Concluída':'#2dd4a0','Atrasada':'#e05555'};
  const grupos={'Crítica':[],'Alta':[],'Média':[],'Baixa':[]};
  acoes.filter(a=>a.status!=='Arquivada'&&a.status!=='Cancelada').forEach(a=>{
    (grupos[a.prioridade]||grupos['Média']).push(a);
  });
  const ids=acoesSelecionadasIds||acoes.map(a=>a.id);
  document.getElementById('lista-plano-acoes').innerHTML=Object.entries(grupos).map(([prioridade,items])=>{
    if(!items.length)return'';
    return`<div style="margin-bottom:14px;">
      <div style="font-size:11px;font-weight:600;color:${PRIOR_COR[prioridade]||'var(--text2)'};text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);">${prioridade} (${items.length})</div>
      ${items.map(a=>`<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
        <input type="checkbox" id="plano-acao-${a.id}" ${ids.includes(a.id)?'checked':''} onchange="atualizarCountPlano()" style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin-top:2px;flex-shrink:0;">
        <label for="plano-acao-${a.id}" style="flex:1;cursor:pointer;">
          <div style="font-size:13px;font-weight:500;color:var(--text);">${h(a.titulo)}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;">
            <span style="color:${STATUS_COR[a.status]||'var(--text3)'};">● ${h(a.status||'Pendente')}</span>
            <span>📋 ${h(a.origem||'Manual')}</span>
            ${a.responsavel?`<span>👤 ${h(a.responsavel)}</span>`:''}
            ${a.prazo?`<span>📅 ${fmtData(a.prazo)}</span>`:''}
          </div>
        </label>
      </div>`).join('')}
    </div>`;
  }).join('');
  atualizarCountPlano();
  document.getElementById('modal-plano').style.display='flex';
}
function atualizarCountPlano(){
  const acoes=window.acoesData||[];
  const total=acoes.filter(a=>a.status!=='Arquivada'&&a.status!=='Cancelada').length;
  const sel=acoes.filter(a=>document.getElementById(`plano-acao-${a.id}`)?.checked).length;
  document.getElementById('plano-count').textContent=`${sel} de ${total} selecionada(s)`;
  document.getElementById('plano-check-all').checked=sel===total;
}
function toggleTodasAcoes(checked){
  (window.acoesData||[]).forEach(a=>{const el=document.getElementById(`plano-acao-${a.id}`);if(el)el.checked=checked;});
  atualizarCountPlano();
}
function fecharModalPlanoAcao(){document.getElementById('modal-plano').style.display='none';}
function aplicarSelecaoPlano(){
  const acoes=window.acoesData||[];
  acoesSelecionadasIds=acoes.filter(a=>document.getElementById(`plano-acao-${a.id}`)?.checked).map(a=>a.id);
  fecharModalPlanoAcao();
  renderDocumento();
}

// ── ESCALA MOBILE DA PÁGINA A4 ──────────────────────────────
const A4_PX = 210 * 96 / 25.4; // largura A4 em pixels a 96dpi ≈ 793.7

function ajustarEscala(){
  const vw = window.innerWidth;
  const escala = vw < A4_PX ? (vw - 16) / A4_PX : 1;
  document.documentElement.style.setProperty('--page-scale', escala.toFixed(4));
}

window.addEventListener('resize', ajustarEscala);
ajustarEscala();

// ── DROPDOWN MOBILE ──────────────────────────────────────────
function toggleMobileMenu(e){
  e.stopPropagation();
  document.getElementById('mobile-dropdown').classList.toggle('open');
}
function fecharMobileMenu(){
  document.getElementById('mobile-dropdown').classList.remove('open');
}
document.addEventListener('click', fecharMobileMenu);

carregar();
</script>
