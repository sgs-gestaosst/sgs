<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LTCAT — Laudo Técnico das Condições Ambientais do Trabalho</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2333;--border:#2a3044;--border-focus:#4a7cdc;
  --accent:#4a7cdc;--accent2:#2dd4a0;--text:#e8eaf0;--text2:#8892a4;--text3:#545e72;
  --radius:6px;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;}
.screen-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
.header-logo{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.08em;border:1px solid var(--border-focus);padding:4px 10px;border-radius:var(--radius);text-decoration:none;}
.screen-actions{margin-left:auto;display:flex;gap:10px;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;text-decoration:none;}
.btn-edit{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-edit:hover{border-color:var(--border-focus);}
.btn-action{background:#3b1f6b;color:#e9d5ff;border:1px solid #5a2a90;}
.btn-action:hover{background:#4a2880;}
.btn-print{background:var(--accent2);color:#0f1117;}
.btn-print:hover{background:#3de8b4;}
.screen-body{padding:40px 24px;display:flex;justify-content:center;}
.pages-wrap{display:flex;flex-direction:column;gap:24px;align-items:center;width:100%;}
/* Status bar */
#status-ltcat{display:none;padding:10px 32px;font-size:12px;font-weight:500;}
/* Painel elaboradora */
#painel-elaboradora{display:none;background:var(--surface2);border-bottom:1px solid var(--border);padding:16px 32px;}
/* A4 */
.page{background:#fff;width:210mm;min-height:297mm;padding:20mm 20mm 20mm 25mm;box-shadow:0 4px 32px rgba(0,0,0,.5);position:relative;color:#1a1a2e;font-family:'IBM Plex Sans',sans-serif;font-size:10pt;line-height:1.5;}
.page::before{content:'';position:absolute;left:0;top:0;bottom:0;width:8mm;background:linear-gradient(180deg,#2a1060 0%,#1a0840 100%);}
/* Tipografia */
.doc-section{font-size:11pt;font-weight:700;color:#1a0840;text-transform:uppercase;letter-spacing:.06em;border-bottom:2pt solid #5a2a90;padding-bottom:5pt;margin:18pt 0 11pt;}
.doc-subsection{font-size:10pt;font-weight:600;color:#3b0764;margin:12pt 0 7pt;padding-bottom:3pt;border-bottom:1pt solid #e5e7eb;}
.doc-text{font-size:10pt;color:#1f2937;line-height:1.65;text-align:justify;}
.num-secao{color:#7c3aed;font-family:'IBM Plex Mono',monospace;font-size:9pt;margin-right:6pt;}
/* Capa */
.capa{display:flex;flex-direction:column;height:100%;max-height:257mm;overflow:hidden;}
.capa-topo{display:flex;align-items:center;gap:14pt;margin-bottom:4pt;}
.capa-topo-info{flex:1;min-width:0;}
.capa-topo-nome{font-size:13pt;font-weight:700;color:#1a0840;line-height:1.2;}
.capa-topo-meta{font-size:8.5pt;color:#4b5563;margin-top:3pt;}
.capa-logo-box{width:60pt;height:60pt;background:#1a0840;display:flex;align-items:center;justify-content:center;border-radius:6pt;flex-shrink:0;overflow:hidden;cursor:pointer;position:relative;}
.capa-logo-text{font-family:'IBM Plex Mono',monospace;font-size:18pt;font-weight:700;color:#fff;}
.capa-divider{height:3pt;background:linear-gradient(90deg,#1a0840,#5a2a90,#a78bfa);margin:16pt 0 18pt;border-radius:2pt;}
.capa-empresa-box{background:#f5f3ff;border-left:4pt solid #7c3aed;padding:14pt 18pt;margin-bottom:18pt;border-radius:0 6pt 6pt 0;}
.capa-rodape-bloco{margin-top:auto;}
.capa-elab-strip{margin-top:12pt;padding:10pt 12pt;border:1pt solid #e5e7eb;border-radius:6pt;background:#fafbfc;display:flex;align-items:center;gap:14pt;}
.capa-elab-strip-label{font-size:7.5pt;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.1em;flex-shrink:0;}
.capa-elab-strip-content{display:flex;align-items:center;gap:10pt;flex:1;min-width:0;}
.capa-elab-strip-logo{width:32pt;height:32pt;background:#f3f4f6;border:1pt solid #d1d5db;border-radius:5pt;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.capa-elab-strip-sigla{font-family:'IBM Plex Mono',monospace;font-size:10pt;font-weight:700;color:#4b5563;}
.capa-elab-strip-nome{font-size:9.5pt;font-weight:600;color:#1f2937;line-height:1.3;}
.capa-elab-strip-cnpj{font-size:8pt;color:#4b5563;font-family:'IBM Plex Mono',monospace;margin-top:1pt;}
/* Ficha */
.ficha-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1pt solid #e5e7eb;border-radius:4pt;overflow:hidden;margin:8pt 0;}
.ficha-grid-3{grid-template-columns:1fr 1fr 1fr;}
.ficha-item{padding:8pt 10pt;border-right:1pt solid #e5e7eb;border-bottom:1pt solid #e5e7eb;}
.ficha-item:nth-child(2n){border-right:none;}
.ficha-grid-3 .ficha-item:nth-child(3n){border-right:none;}
.ficha-item:last-child,.ficha-item:nth-last-child(2){border-bottom:none;}
.ficha-grid-3 .ficha-item:nth-last-child(3){border-bottom:none;}
.ficha-full{grid-column:1/-1;border-right:none!important;}
.ficha-label{font-size:7.5pt;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;margin-bottom:3pt;}
.ficha-value{font-size:10pt;color:#0d0826;font-weight:500;}
/* Tabela */
.doc-table{width:100%;border-collapse:collapse;margin:8pt 0;font-size:9pt;}
.doc-table th{background:#1a0840;color:#fff;padding:6pt 8pt;text-align:left;font-size:8pt;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.doc-table td{padding:6pt 8pt;border-bottom:1pt solid #e5e7eb;vertical-align:top;color:#1f2937;}
.doc-table tr:nth-child(even) td{background:#f9fafb;}
.doc-table tr:last-child td{border-bottom:none;}
/* Badges */
.res-dentro{background:#dcfce7;color:#166534;padding:2pt 7pt;border-radius:4pt;font-size:8pt;font-weight:700;border:1pt solid #86efac;}
.res-acima{background:#fee2e2;color:#991b1b;padding:2pt 7pt;border-radius:4pt;font-size:8pt;font-weight:700;border:1pt solid #fca5a5;}
.res-nq{background:#f3f4f6;color:#4b5563;padding:2pt 7pt;border-radius:4pt;font-size:8pt;font-weight:600;border:1pt solid #d1d5db;}
.insal-badge{background:#fef9c3;color:#854d0e;padding:2pt 7pt;border-radius:4pt;font-size:8pt;font-weight:700;border:1pt solid #fde68a;}
.apos-badge{background:#f3e8ff;color:#6b21a8;padding:2pt 7pt;border-radius:4pt;font-size:8pt;font-weight:700;border:1pt solid #d8b4fe;}
/* Em breve */
.em-breve{background:#f9fafb;border:1pt dashed #d1d5db;border-radius:4pt;padding:16pt;text-align:center;margin:10pt 0;}
/* Header/Footer */
.page-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1.5pt solid #e5e7eb;padding-bottom:8pt;margin-bottom:16pt;}
.ph-empresa{font-size:8.5pt;font-weight:700;color:#1f2937;}
.ph-doc{font-size:8pt;color:#6b7280;font-family:'IBM Plex Mono',monospace;}
.page-footer{position:absolute;bottom:10mm;left:25mm;right:20mm;display:flex;justify-content:space-between;align-items:center;border-top:1pt solid #d1d5db;padding-top:6pt;height:12mm;overflow:hidden;}
.pf-label{font-size:7.5pt;color:#6b7280;font-weight:500;}
.pf-page{font-family:'IBM Plex Mono',monospace;font-size:8pt;color:#4b5563;font-weight:600;}
/* Medição box */
.med-box{border:1pt solid #e5e7eb;border-radius:6pt;margin:10pt 0;overflow:hidden;page-break-inside:avoid;break-inside:avoid;}
.med-box-header{background:#f5f3ff;padding:9pt 12pt;border-bottom:1pt solid #e5e7eb;display:flex;align-items:center;gap:8pt;flex-wrap:wrap;}
.med-box-cat{font-size:7pt;padding:2pt 7pt;border-radius:3pt;font-weight:700;}
.med-box-nome{font-size:10.5pt;font-weight:700;color:#1a0840;flex:1;}
.med-box-body{padding:10pt 12pt;}
.med-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8pt;margin-bottom:8pt;}
.med-field .label{font-size:7.5pt;color:#6b7280;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3pt;}
.med-field .value{font-size:9pt;color:#1f2937;font-weight:500;}
.conclusao-box{background:#faf5ff;border-left:3pt solid #7c3aed;padding:8pt 12pt;font-size:9.5pt;color:#1f2937;margin-top:8pt;border-radius:0 4pt 4pt 0;line-height:1.5;}
/* Print — robusto igual PGR e PCMSO */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  body{background:#fff!important;margin:0!important;padding:0!important;}
  .screen-header,#painel-elaboradora,#status-ltcat{display:none!important;}
  .screen-body{padding:0!important;display:block!important;}
  .pages-wrap{gap:0!important;display:block!important;align-items:unset!important;}
  @page{size:A4;margin:0;}
  .page{
    box-shadow:none!important;margin:0!important;
    width:210mm!important;height:297mm!important;
    min-height:unset!important;max-height:unset!important;
    overflow:hidden!important;
    padding:14mm 16mm 28mm 22mm!important;
    border-left:8mm solid #1a0840!important;
    page-break-after:always!important;break-after:page!important;
    position:relative!important;box-sizing:border-box!important;
  }
  .page::before{display:none!important;}
  .page:last-child{page-break-after:auto!important;break-after:auto!important;}
  .page-footer{
    position:absolute!important;bottom:10mm!important;
    left:22mm!important;right:16mm!important;
    margin-top:0!important;border-top:1pt solid #d1d5db!important;
    padding-top:5pt!important;display:flex!important;
    justify-content:space-between!important;background:#fff!important;
    height:12mm!important;overflow:hidden!important;
  }
  .capa{max-height:257mm!important;overflow:hidden!important;}
  .capa-rodape-bloco{page-break-inside:avoid;break-inside:avoid;}
  .doc-section{page-break-after:avoid;break-after:avoid;}
  .med-box{page-break-inside:avoid;break-inside:avoid;}
  .doc-table tr{page-break-inside:avoid;break-inside:avoid;}
  .ficha-grid{page-break-inside:avoid;break-inside:avoid;}
  /* Contraste total para impressão */
  .ficha-label,.med-field .label,.ph-doc,.pf-label{color:#4b5563!important;}
  .ficha-value,.med-field .value,.doc-text{color:#0d0826!important;}
  .ph-empresa{color:#0d0826!important;font-weight:700!important;}
  .pf-page{color:#374151!important;font-weight:600!important;}
  .conclusao-box{color:#0d0826!important;}
  [style*="color:#9ca3af"],[style*="color:#6b7280"]{color:#374151!important;}
  .res-dentro,.res-acima,.res-nq,.insal-badge,.apos-badge{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important;}
}
@media(max-width:230mm){.page{width:100%;padding:15mm 12mm 15mm 18mm;}.page::before{width:5mm;}}
</style>
</head>
<body>
<div class="screen-header">
  <a href="index.html" class="header-logo" style="text-decoration:none;">SGS</a>
  <span style="font-size:13px;color:var(--text2);">LTCAT — Visualização</span>
  <div class="screen-actions">
    <button class="btn btn-edit" onclick="toggleElaboradora()">✏️ Elaboradora</button>
    <button class="btn btn-action" id="btn-gerar-acoes" onclick="gerarAcoesLTCAT()">⚡ Gerar Ações</button>
    <a id="btn-voltar" href="#" class="btn btn-edit" style="text-decoration:none;">← Voltar</a>
    <button class="btn btn-print" onclick="window.print()">🖨️ Imprimir / PDF</button>
  </div>
</div>

<div id="status-ltcat"></div>

<!-- Painel elaboradora -->
<div id="painel-elaboradora">
  <div style="max-width:1100px;margin:0 auto;display:grid;grid-template-columns:auto 1fr 1fr 1fr 1fr 1fr;gap:14px;align-items:end;">
    <div>
      <label style="display:block;font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;">Logo elaboradora</label>
      <div id="logo-preview" onclick="document.getElementById('elab-logo-input').click()" style="width:56px;height:56px;border-radius:8px;background:#1a2540;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;font-size:11px;color:var(--text3);text-align:center;line-height:1.3;">📷<br>Logo</div>
      <input type="file" id="elab-logo-input" accept="image/*" style="display:none;" onchange="carregarLogo(this)">
    </div>
    <div>
      <label style="display:block;font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;">Empresa elaboradora</label>
      <input type="text" id="elab-nome" placeholder="Nome da empresa" oninput="atualizarElaboradora()" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 12px;outline:none;">
    </div>
    <div>
      <label style="display:block;font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;">CNPJ elaboradora</label>
      <input type="text" id="elab-cnpj" placeholder="00.000.000/0000-00" oninput="atualizarElaboradora()" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--mono);font-size:13px;padding:8px 12px;outline:none;">
    </div>
    <div>
      <label style="display:block;font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;">Responsável técnico</label>
      <input type="text" id="elab-responsavel" placeholder="Nome + CREA/CRM" oninput="atualizarElaboradora()" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 12px;outline:none;">
    </div>
    <div>
      <label style="display:block;font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;">Nº ART</label>
      <input type="text" id="elab-art" placeholder="Número da ART" oninput="atualizarElaboradora()" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--mono);font-size:13px;padding:8px 12px;outline:none;">
    </div>
    <div>
      <label style="display:block;font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;">Data de elaboração</label>
      <input type="date" id="elab-data" oninput="atualizarElaboradora()" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 12px;outline:none;">
    </div>
  </div>
  <div style="max-width:1100px;margin:8px auto 0;font-size:11px;color:var(--text3);">ℹ️ Dados não salvos no banco — preencha antes de imprimir.</div>
</div>

<div class="screen-body">
  <div class="pages-wrap" id="pages-wrap">
    <div style="color:var(--text2);text-align:center;padding:40px;">Carregando documento...</div>
  </div>
</div>

<script>
const SUPA_URL='https://ookqdukeulwcnhilbgbo.supabase.co';
const SUPA_KEY='sb_publishable_l9NggU-e1bgt7CnrYUWo4w_AMoaJa2e';
const token=localStorage.getItem('sgs_token');
if(!token)window.location.href='login.html';
const params=new URLSearchParams(window.location.search);
const empresaId=params.get('empresa_id');
if(!empresaId)window.location.href='empresas.html';
document.getElementById('btn-voltar').href=`medicoes.html?empresa_id=${empresaId}`;
// Init date input
document.getElementById('elab-data').value=new Date().toISOString().split('T')[0];

let empresa,cnaes,setores,medicoes,riscos,categorias,setorRiscos;
let elaboradora={nome:'',cnpj:'',responsavel:'',art:'',logoUrl:'',dataElaboracao:new Date().toISOString().split('T')[0]};

const grInfo={1:{label:'GR 1 — Baixo'},2:{label:'GR 2 — Médio-Baixo'},3:{label:'GR 3 — Médio-Alto'},4:{label:'GR 4 — Alto'}};
const CAT_CORES={'Físico':{bg:'#fef9c3',color:'#854d0e'},'Químico':{bg:'#fee2e2',color:'#991b1b'},'Biológico':{bg:'#f3e8ff',color:'#6b21a8'},'Ergonômico':{bg:'#dbeafe',color:'#1d4ed8'},'Acidente':{bg:'#ffedd5',color:'#9a3412'},'Psicossocial':{bg:'#fce7f3',color:'#9d174d'}};

function escHtml(s){const str=s===null||s===undefined?'':(s+'');return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtData(d){if(!d)return'—';return new Date(d+'T00:00:00').toLocaleDateString('pt-BR');}
function fmtDataAtual(){return new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});}
function fmtAno(){return new Date().getFullYear();}
function getCatNome(catId){return categorias?.find(x=>x.id===catId)?.nome||'—';}
function getCatCor(catId){return CAT_CORES[getCatNome(catId)]||{bg:'#f3f4f6',color:'#374151'};}
function setStatus(msg,tipo){
  const el=document.getElementById('status-ltcat');
  el.style.display='block';el.textContent=msg;
  el.style.background=tipo==='success'?'#166534':tipo==='error'?'#7f1d1d':'#1e3a5f';
  el.style.color='#fff';el.style.padding='10px 32px';
  if(tipo==='success')setTimeout(()=>el.style.display='none',3500);
}

async function carregar(){
  try{
    const H={'apikey':SUPA_KEY,'Authorization':`Bearer ${token}`};
    const [resEmp,resCnaes,resSets,resMed,resRiscos,resCats]=await Promise.all([
      fetch(`${SUPA_URL}/rest/v1/empresas?id=eq.${empresaId}&select=*`,{headers:H}),
      fetch(`${SUPA_URL}/rest/v1/empresa_cnaes?empresa_id=eq.${empresaId}&select=*&order=tipo.asc`,{headers:H}),
      fetch(`${SUPA_URL}/rest/v1/setores?empresa_id=eq.${empresaId}&ativo=eq.true&select=*&order=nome_setor.asc`,{headers:H}),
      fetch(`${SUPA_URL}/rest/v1/medicoes_ambientais?empresa_id=eq.${empresaId}&ativo=eq.true&select=*&order=setor_id.asc,data_medicao.desc`,{headers:H}),
      fetch(`${SUPA_URL}/rest/v1/riscos?ativo=eq.true&select=id,nome_risco,categoria_risco_id,limite_tolerancia,limite_tolerancia_esocial,metodologia_avaliacao,codigo_tabela24_esocial,gera_aposentadoria_especial`,{headers:H}),
      fetch(`${SUPA_URL}/rest/v1/categorias_risco?ativo=eq.true&select=id,nome`,{headers:H}),
    ]);
    [empresa,cnaes,setores,medicoes,riscos,categorias]=await Promise.all([
      resEmp.json(),resCnaes.json(),resSets.json(),resMed.json(),resRiscos.json(),resCats.json()
    ]);
    empresa=empresa[0];
    if(setores.length>0){
      const setorIds=setores.map(s=>s.id).join(',');
      const resSR=await fetch(`${SUPA_URL}/rest/v1/setor_riscos?setor_id=in.(${setorIds})&ativo=eq.true&select=*`,{headers:H});
      setorRiscos=await resSR.json();
    }else{setorRiscos=[];}
    // Avaliações ergonômicas (AET) para seção complementar
    try{
      const resAetMets=await fetch(`${SUPA_URL}/rest/v1/aet_metodologias?empresa_id=eq.${empresaId}&ativo=eq.true&select=*,aet_avaliacoes(numero_aet,data_avaliacao,responsavel_tecnico,setor_id,funcao_id,conclusao_tecnica)&order=criado_em.desc`,{headers:H});
      window.ltcatAetMets=resAetMets.ok?await resAetMets.json():[];
      const resAets=await fetch(`${SUPA_URL}/rest/v1/aet_avaliacoes?empresa_id=eq.${empresaId}&ativo=eq.true&select=*&order=data_avaliacao.desc`,{headers:H});
      window.ltcatAets=resAets.ok?await resAets.json():[];
    }catch(_){window.ltcatAetMets=[];window.ltcatAets=[];}
    renderDocumento();
  }catch(e){
    document.getElementById('pages-wrap').innerHTML=`<div style="color:#e05555;text-align:center;padding:40px;">Erro: ${escHtml(e.message)}</div>`;
  }
}

function renderDocumento(){
  const wrap=document.getElementById('pages-wrap');
  wrap.innerHTML='';
  const allPages=[];
  allPages.push(renderCapa());
  allPages.push(renderSumario());
  allPages.push(renderIdentificacao());
  allPages.push(renderBaseLegal());
  renderProcessos().forEach(p=>allPages.push(p));
  renderMedicoes().forEach(p=>allPages.push(p));
  renderMedidas().forEach(p=>allPages.push(p));
  allPages.push(renderConclusao());
  allPages.forEach(p=>wrap.appendChild(p));
  numerarPaginas(allPages);
}

function numerarPaginas(pages){
  const idx={};
  pages.forEach((p,i)=>{const s=p.dataset.section;if(s&&!idx[s])idx[s]=i+1;});
  pages.forEach((p,i)=>{const el=p.querySelector('.pf-page');if(el)el.textContent=`Página ${i+1}`;});
  const sumario=pages.find(p=>p.dataset.section==='sumario');
  if(sumario)sumario.querySelectorAll('[data-sec-ref]').forEach(el=>{const n=idx[el.dataset.secRef];el.textContent=n?n:'—';});
}

            <div class="med-field"><div class="label">Limite de tolerância</div><div class="value">${escHtml(risco?.limite_tolerancia_esocial||risco?.limite_tolerancia||'—')}</div></div>

// ── MEDIDAS DE CONTROLE ───────────────────────────────
function renderMedidas(){
  const pages=[];
  const pg=makePg('medidas');
  const nm=empresa.nome_fantasia||empresa.razao_social;
  const porRisco={};
  (setorRiscos||[]).forEach(sr=>{if(!porRisco[sr.risco_id])porRisco[sr.risco_id]=[];porRisco[sr.risco_id].push(sr);});
  const riscoIds=Object.keys(porRisco);

  const medidasHtml=riscoIds.length?riscoIds.map(rid=>{
    const risco=riscos.find(r=>r.id==rid);
    const srs=porRisco[rid];
    const catCor=getCatCor(risco?.categoria_risco_id);
    const catNome=getCatNome(risco?.categoria_risco_id);
    const temElim=srs.some(sr=>sr.medida_elim);
    const temSubs=srs.some(sr=>sr.medida_subs);
    const temEng=srs.some(sr=>sr.medida_eng);
    const temAdm=srs.some(sr=>sr.medida_adm);
    const temEpi=srs.some(sr=>sr.medida_epi);
    if(!temElim&&!temSubs&&!temEng&&!temAdm&&!temEpi)return'';
    const descElim=srs.map(sr=>sr.medida_elim_desc).filter(Boolean).join('; ');
    const descSubs=srs.map(sr=>sr.medida_subs_desc).filter(Boolean).join('; ');
    const descEng=srs.map(sr=>sr.medida_eng_desc).filter(Boolean).join('; ');
    const descAdm=srs.map(sr=>sr.medida_adm_desc).filter(Boolean).join('; ');
    const setoresNomes=srs.map(sr=>setores.find(s=>s.id===sr.setor_id)?.nome_setor).filter(Boolean);
    return`<div style="border:1pt solid #e5e7eb;border-radius:6pt;margin-bottom:10pt;overflow:hidden;page-break-inside:avoid;break-inside:avoid;">
      <div class="med-box-header">
        <span class="med-box-cat" style="background:${catCor.bg};color:${catCor.color};">${catNome}</span>
        <span class="med-box-nome">${escHtml(risco?.nome_risco||'—')}</span>
        <span style="font-size:8pt;color:#6b7280;">${setoresNomes.join(' · ')}</span>
      </div>
      <div class="med-box-body" style="padding:6pt 12pt;">
        <table style="width:100%;border-collapse:collapse;font-size:9pt;">
          ${temElim?`<tr style="border-bottom:1pt solid #f3f4f6;"><td style="padding:5pt 8pt;width:30%;font-weight:600;color:#166534;background:#f0fdf4;border-radius:3pt 0 0 3pt;">🚫 Eliminação</td><td style="padding:5pt 8pt;">${escHtml(descElim||'Prevista no inventário de riscos.')}</td></tr>`:''}
          ${temSubs?`<tr style="border-bottom:1pt solid #f3f4f6;"><td style="padding:5pt 8pt;width:30%;font-weight:600;color:#1d4ed8;background:#eff6ff;">🔄 Substituição</td><td style="padding:5pt 8pt;">${escHtml(descSubs||'Prevista no inventário de riscos.')}</td></tr>`:''}
          ${temEng?`<tr style="border-bottom:1pt solid #f3f4f6;"><td style="padding:5pt 8pt;width:30%;font-weight:600;color:#854d0e;background:#fffbeb;">🔧 Engenharia / EPC</td><td style="padding:5pt 8pt;">${escHtml(descEng||'Prevista no inventário de riscos.')}</td></tr>`:''}
          ${temAdm?`<tr style="border-bottom:1pt solid #f3f4f6;"><td style="padding:5pt 8pt;width:30%;font-weight:600;color:#6b21a8;background:#f5f3ff;">📋 Administrativo</td><td style="padding:5pt 8pt;">${escHtml(descAdm||'Prevista no inventário de riscos.')}</td></tr>`:''}
          ${temEpi?`<tr><td style="padding:5pt 8pt;width:30%;font-weight:600;color:#991b1b;background:#fef2f2;">🦺 EPI Obrigatório</td><td style="padding:5pt 8pt;">Uso de EPI obrigatório conforme CAEPI/MTE. Verificar CA e data de validade junto ao técnico responsável.</td></tr>`:''}
        </table>
      </div>
    </div>`;
  }).filter(Boolean).join(''):`<div class="em-breve"><p style="font-size:9pt;color:#9ca3af;font-style:italic;">Medidas de controle não cadastradas no inventário de riscos. Acesse o módulo de Riscos para registrar as medidas por setor.</p></div>`;

  pg.innerHTML=`
  ${hdr(nm,fmtAno())}
  <div class="doc-section"><span class="num-secao">5</span>Medidas de Controle</div>
  <p class="doc-text" style="margin-bottom:12pt;">As medidas de controle seguem a hierarquia NR-1 (2025): <strong>Eliminação → Substituição → Controles de Engenharia (EPC) → Medidas Administrativas → EPI</strong>, priorizando sempre os controles coletivos.</p>
  ${medidasHtml}
  ${ftr(nm)}`;
  pages.push(pg);
  return pages;
}

// ── ELABORADORA ───────────────────────────────────────
function toggleElaboradora(){
  const p=document.getElementById('painel-elaboradora');
  p.style.display=p.style.display==='none'||!p.style.display?'block':'none';
}
function carregarLogo(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    elaboradora.logoUrl=e.target.result;
    document.getElementById('logo-preview').innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:contain;">`;
    atualizarLogoElaboradora();
  };
  reader.readAsDataURL(file);
}
function carregarLogoEmpresa(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const box=document.getElementById('capa-empresa-logo-box');
    if(box){
      box.innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:contain;border-radius:4pt;">
        <input type="file" id="empresa-logo-input" accept="image/*" style="display:none;" onchange="carregarLogoEmpresa(this)">`;
    }
  };
  reader.readAsDataURL(file);
}
function atualizarLogoElaboradora(){
  const el=document.getElementById('doc-elab-logo-sm');if(!el)return;
  if(elaboradora.logoUrl){
    el.innerHTML=`<img src="${elaboradora.logoUrl}" style="width:100%;height:100%;object-fit:contain;border-radius:3pt;">`;
  }else{
    const s=(elaboradora.nome||'SST').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'SST';
    el.innerHTML=`<span class="capa-elab-strip-sigla">${s}</span>`;
  }
}
function atualizarElaboradora(){
  elaboradora.nome=document.getElementById('elab-nome').value.trim();
  elaboradora.cnpj=document.getElementById('elab-cnpj').value.trim();
  elaboradora.responsavel=document.getElementById('elab-responsavel').value.trim();
  elaboradora.art=document.getElementById('elab-art').value.trim();
  elaboradora.dataElaboracao=document.getElementById('elab-data').value;

  const q=(id,txt)=>{const el=document.getElementById(id);if(el)el.textContent=txt;};
  q('doc-elab-nome',elaboradora.nome||'Empresa Elaboradora');
  q('doc-elab-cnpj',elaboradora.cnpj||'—');
  q('doc-elab-resp',elaboradora.responsavel||'—');
  q('doc-elab-art-val',elaboradora.art?'ART: '+elaboradora.art:'—');
  q('doc-data-elab',elaboradora.dataElaboracao?fmtData(elaboradora.dataElaboracao):fmtDataAtual());

  document.querySelectorAll('.elab-resp-field').forEach(el=>el.textContent=elaboradora.responsavel||'—');
  document.querySelectorAll('.elab-nome-field').forEach(el=>el.textContent=elaboradora.nome||'—');
  document.querySelectorAll('.elab-art-field').forEach(el=>el.textContent=elaboradora.art||'—');
  document.querySelectorAll('.elab-cnpj-field').forEach(el=>el.textContent=elaboradora.cnpj||'—');
  document.querySelectorAll('.elab-data-field').forEach(el=>el.textContent=elaboradora.dataElaboracao?fmtData(elaboradora.dataElaboracao):fmtDataAtual());
  atualizarLogoElaboradora();
}

// ── GERAR AÇÕES LTCAT ─────────────────────────────────
async function gerarAcoesLTCAT(){
  const btn=document.getElementById('btn-gerar-acoes');
  btn.disabled=true;btn.textContent='⏳ Gerando...';
  setStatus('Criando ações na Central de Ações...','info');
  const H={'apikey':SUPA_KEY,'Authorization':`Bearer ${token}`,'Content-Type':'application/json','Prefer':'return=minimal'};
  const hoje=new Date();
  const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().split('T')[0];};

  const acoes=[];
  // Medições acima do limite → ação de controle
  medicoes.filter(m=>m.resultado==='Acima do limite').forEach(m=>{
    const risco=riscos.find(r=>r.id===m.risco_id);
    const setor=setores.find(s=>s.id===m.setor_id);
    acoes.push({
      empresa_id:parseInt(empresaId),setor_id:m.setor_id,
      titulo:`Controlar exposição — ${risco?.nome_risco||'agente'} · ${setor?.nome_setor||'setor'}`,
      descricao:`Medição de ${fmtData(m.data_medicao)} revelou valor acima do limite de tolerância (${m.valor_medido||'—'} ${m.unidade||''}). Implementar medidas de controle conforme hierarquia NR-1.`,
      origem:'LTCAT',prioridade:'Alta',prazo:add(hoje,60),status:'Pendente',
    });
  });
  // Aposentadoria especial → emitir PPP por setor
  const setoresApos=[...new Set(medicoes.filter(m=>m.gera_aposentadoria_especial).map(m=>m.setor_id))];
  setoresApos.forEach(sid=>{
    const setor=setores.find(s=>s.id===sid);
    acoes.push({
      empresa_id:parseInt(empresaId),setor_id:sid,
      titulo:`Emitir PPP — aposentadoria especial · ${setor?.nome_setor||'setor'}`,
      descricao:'Trabalhadores deste setor são expostos a agente enquadrado para aposentadoria especial. Emitir Perfil Profissiográfico Previdenciário (PPP) conforme IN INSS 77/2015.',
      origem:'LTCAT',prioridade:'Alta',prazo:add(hoje,30),status:'Pendente',
    });
  });
  // Revisão anual
  acoes.push({
    empresa_id:parseInt(empresaId),
    titulo:`Revisão do LTCAT — ${hoje.getFullYear()+1}`,
    descricao:'Revisão anual do Laudo Técnico das Condições Ambientais do Trabalho conforme Decreto nº 3.048/99 e IN INSS/PRES nº 77/2015, art. 261.',
    origem:'LTCAT',prioridade:'Média',prazo:add(hoje,365),status:'Pendente',
  });

  try{
    const res=await fetch(`${SUPA_URL}/rest/v1/acoes`,{method:'POST',headers:H,body:JSON.stringify(acoes)});
    if(!res.ok)throw new Error(await res.text());
    setStatus(`✅ ${acoes.length} ação(ões) criada(s) com sucesso na Central de Ações!`,'success');
  }catch(e){
    setStatus(`Erro: ${e.message}`,'error');
  }
  btn.disabled=false;btn.textContent='⚡ Gerar Ações';
}

carregar();
</script>
