<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificação de Treinamentos — SGS</title>
<style>
:root {
  --navy: #0D2137;
  --navy2: #1A3A5C;
  --green: #059669;
  --green-bg: #ECFDF5;
  --orange: #D97706;
  --orange-bg: #FFFBEB;
  --red: #DC2626;
  --red-bg: #FEF2F2;
  --gray: #6B7280;
  --gray-bg: #F9FAFB;
  --border: #E5E7EB;
  --text: #111827;
  --text2: #4B5563;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Arial', sans-serif; background: #F3F4F6; min-height: 100vh; color: var(--text); }

/* Header */
.hdr { background: var(--navy); padding: 18px 20px; display: flex; align-items: center; gap: 12px; }
.hdr-icon { font-size: 22px; }
.hdr-title { font-size: 15px; font-weight: 700; color: #fff; }
.hdr-sub { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 1px; }

/* Container */
.container { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }

/* Loading / Error */
.state { text-align: center; padding: 60px 20px; }
.state-icon { font-size: 40px; margin-bottom: 12px; }
.state-title { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
.state-sub { font-size: 14px; color: var(--gray); }
.spinner { width: 40px; height: 40px; border: 4px solid #e5e7eb; border-top-color: var(--navy); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Employee card */
.emp-card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
.emp-name { font-size: 20px; font-weight: 800; color: var(--navy); margin-bottom: 4px; line-height: 1.2; }
.emp-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.badge { display: inline-flex; align-items: center; gap: 4px; background: var(--gray-bg); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 12px; color: var(--text2); }
.badge b { color: var(--navy); font-weight: 700; }
.emp-company { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--gray); }
.emp-company b { color: var(--navy2); }

/* Section title */
.sec-title { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gray); margin: 20px 0 10px; }

/* Training card */
.tr-card { background: #fff; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); display: flex; align-items: flex-start; gap: 12px; }
.tr-status { flex-shrink: 0; margin-top: 2px; }
.pill { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; }
.pill-green { background: var(--green-bg); color: var(--green); }
.pill-orange { background: var(--orange-bg); color: var(--orange); }
.pill-red { background: var(--red-bg); color: var(--red); }
.pill-gray { background: var(--gray-bg); color: var(--gray); border: 1px solid var(--border); }
.tr-body { flex: 1; min-width: 0; }
.tr-nr { font-size: 11px; font-weight: 700; color: var(--orange); letter-spacing: 0.5px; margin-bottom: 2px; }
.tr-nome { font-size: 14px; font-weight: 700; color: var(--navy); line-height: 1.3; margin-bottom: 4px; }
.tr-meta { font-size: 12px; color: var(--gray); display: flex; flex-wrap: wrap; gap: 6px 14px; }

/* Summary bar */
.summary { background: var(--navy); border-radius: 10px; padding: 14px 16px; margin-bottom: 6px; display: flex; justify-content: space-around; text-align: center; }
.sum-item { color: rgba(255,255,255,.6); }
.sum-num { font-size: 22px; font-weight: 800; color: #fff; display: block; }
.sum-lbl { font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; margin-top: 2px; display: block; }
.sum-green .sum-num { color: #34D399; }
.sum-orange .sum-num { color: #FBBF24; }
.sum-red .sum-num { color: #F87171; }

/* Footer */
.ftr { text-align: center; margin-top: 28px; font-size: 11px; color: var(--gray); }
.ftr a { color: var(--navy2); text-decoration: none; font-weight: 600; }

/* Empty */
.empty { text-align: center; padding: 30px 16px; color: var(--gray); font-size: 14px; }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-icon">🛡️</div>
  <div>
    <div class="hdr-title">SGS — Verificação de Treinamentos</div>
    <div class="hdr-sub">Sistema de Gestão em SST</div>
  </div>
</div>

<div class="container">
  <div id="loading" class="state">
    <div class="spinner"></div>
    <div class="state-title">Buscando dados...</div>
    <div class="state-sub">Aguarde um momento</div>
  </div>

  <div id="error" class="state" style="display:none">
    <div class="state-icon">⚠️</div>
    <div class="state-title" id="err-title">Funcionário não encontrado</div>
    <div class="state-sub" id="err-sub">Verifique se o QR Code está legível e tente novamente.</div>
  </div>

  <div id="content" style="display:none">
    <div class="emp-card">
      <div class="emp-name" id="emp-nome"></div>
      <div class="emp-badges" id="emp-badges"></div>
      <div class="emp-company" id="emp-company"></div>
    </div>

    <div class="summary" id="summary"></div>

    <div class="sec-title">Treinamentos</div>
    <div id="tr-list"></div>

    <div class="ftr">
      Dados em tempo real via <a href="https://sgs.tec5.com.br" target="_blank">SGS</a> — Sistema de Gestão em SST
    </div>
  </div>
</div>

<script>
const SUPA_URL = 'https://ookqdukeulwcnhilbgbo.supabase.co';
const SUPA_KEY = 'sb_publishable_l9NggU-e1bgt7CnrYUWo4w_AMoaJa2e';

function h(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function api(path) {
  return fetch(SUPA_URL + '/rest/v1/' + path, {
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
  }).then(r => r.json());
}
function fmtData(s) {
  if (!s) return '—';
  const [y, m, d] = s.split('-');
  return d + '/' + m + '/' + y;
}
function getStatus(venc) {
  if (!venc) return { text: 'Sem validade', cls: 'pill-gray' };
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const v = new Date(venc + 'T00:00:00');
  const diff = Math.ceil((v - hoje) / 86400000);
  if (diff < 0) return { text: 'Vencido', cls: 'pill-red' };
  if (diff <= 30) return { text: 'Vence em ' + diff + ' dias', cls: 'pill-orange' };
  return { text: 'Válido', cls: 'pill-green' };
}

async function carregar() {
  const params = new URLSearchParams(location.search);
  const fid = params.get('fid');
  if (!fid || !/^[0-9a-f-]{36}$/.test(fid)) {
    mostrarErro('QR Code inválido', 'O identificador do funcionário não é válido.');
    return;
  }

  try {
    const [funcs, treinRaw] = await Promise.all([
      api('funcionarios?id=eq.' + fid + '&select=id,nome_completo,cpf,matricula,funcao_id,empresa_id&limit=1'),
      api('funcionario_treinamentos?funcionario_id=eq.' + fid + '&ativo=eq.true&select=*&order=data_vencimento.asc')
    ]);

    if (!funcs || !funcs.length) {
      mostrarErro('Funcionário não encontrado', 'Nenhum registro encontrado para este QR Code.');
      return;
    }

    const func = funcs[0];

    const [emps, fnArr, catArr] = await Promise.all([
      api('empresas?id=eq.' + func.empresa_id + '&select=id,nome_fantasia,razao_social,cnpj,cnpj_completo&limit=1'),
      func.funcao_id ? api('funcoes?id=eq.' + func.funcao_id + '&select=id,nome_funcao&limit=1') : Promise.resolve([]),
      treinRaw.length ? api('catalogo_treinamentos?select=id,nome,nr_relacionada,carga_horaria_inicial') : Promise.resolve([])
    ]);

    const emp = emps?.[0];
    const funcao = fnArr?.[0];
    const catMap = Object.fromEntries((catArr||[]).map(c => [c.id, c]));
    const nomeEmp = emp?.nome_fantasia || emp?.razao_social || '—';
    const cnpj = emp?.cnpj || emp?.cnpj_completo || '';

    // Preenche card do funcionário
    document.getElementById('emp-nome').textContent = func.nome_completo || '—';

    let badges = '';
    if (funcao?.nome_funcao) badges += `<span class="badge"><b>${h(funcao.nome_funcao)}</b></span>`;
    if (func.matricula) badges += `<span class="badge">Mat. <b>${h(func.matricula)}</b></span>`;
    if (func.cpf) badges += `<span class="badge">CPF <b>${h(func.cpf)}</b></span>`;
    document.getElementById('emp-badges').innerHTML = badges;
    document.getElementById('emp-company').innerHTML = `<b>${h(nomeEmp)}</b>${cnpj ? ' &nbsp;·&nbsp; CNPJ ' + h(cnpj) : ''}`;

    // Resumo
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    let validos = 0, aVencer = 0, vencidos = 0;
    treinRaw.forEach(t => {
      if (!t.data_vencimento) return;
      const v = new Date(t.data_vencimento + 'T00:00:00');
      const diff = Math.ceil((v - hoje) / 86400000);
      if (diff < 0) vencidos++;
      else if (diff <= 30) aVencer++;
      else validos++;
    });
    document.getElementById('summary').innerHTML =
      `<div class="sum-item sum-green"><span class="sum-num">${validos}</span><span class="sum-lbl">Válidos</span></div>`
      + `<div class="sum-item sum-orange"><span class="sum-num">${aVencer}</span><span class="sum-lbl">A Vencer</span></div>`
      + `<div class="sum-item sum-red"><span class="sum-num">${vencidos}</span><span class="sum-lbl">Vencidos</span></div>`
      + `<div class="sum-item"><span class="sum-num">${treinRaw.length}</span><span class="sum-lbl">Total</span></div>`;

    // Lista de treinamentos
    if (!treinRaw.length) {
      document.getElementById('tr-list').innerHTML = '<div class="empty">Nenhum treinamento registrado.</div>';
    } else {
      document.getElementById('tr-list').innerHTML = treinRaw.map(t => {
        const cat = catMap[t.treinamento_id] || {};
        const st = getStatus(t.data_vencimento);
        return `<div class="tr-card">
          <div class="tr-status"><span class="pill ${st.cls}">${h(st.text)}</span></div>
          <div class="tr-body">
            ${cat.nr_relacionada ? `<div class="tr-nr">${h(cat.nr_relacionada)}</div>` : ''}
            <div class="tr-nome">${h(cat.nome || t.treinamento_id)}</div>
            <div class="tr-meta">
              <span>📅 ${fmtData(t.data_realizacao)}</span>
              ${t.data_vencimento ? `<span>⏳ Vence: ${fmtData(t.data_vencimento)}</span>` : ''}
              ${t.carga_horaria ? `<span>⏱ ${t.carga_horaria}h</span>` : ''}
              ${t.tipo ? `<span>📋 ${h(t.tipo)}</span>` : ''}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = '';

  } catch(e) {
    mostrarErro('Erro ao carregar', 'Verifique sua conexão e tente novamente.');
  }
}

function mostrarErro(titulo, sub) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('err-title').textContent = titulo;
  document.getElementById('err-sub').textContent = sub;
  document.getElementById('error').style.display = '';
}

carregar();
</script>
</body>
</html>
