<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGS — Catálogo de Serviços</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2333;--border:#2a3044;--border-focus:#4a7cdc;
  --accent:#4a7cdc;--accent2:#2dd4a0;--text:#e8eaf0;--text2:#8892a4;--text3:#545e72;
  --danger:#e05555;--warning:#e0a855;--success:#2dd4a0;
  --radius:6px;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
.header-logo{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.08em;border:1px solid var(--border-focus);padding:4px 10px;border-radius:var(--radius);text-decoration:none;}
.header-title{font-size:13px;color:var(--text2);flex:1;}
.header-title span{color:var(--text);font-weight:500;}
.header-actions{display:flex;gap:8px;align-items:center;margin-left:auto;}
.container{max-width:1100px;margin:0 auto;padding:32px 24px 80px;}
.voltar{font-size:12px;color:var(--text2);text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;}
.voltar:hover{color:var(--text);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;text-decoration:none;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#5a8ce8;}
.btn-edit{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-edit:hover{border-color:var(--border-focus);}
.btn-save{background:var(--accent2);color:#0f1117;}
.btn-save:hover{background:#3de8b4;}
.btn-cancel{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.btn-cancel:hover{border-color:var(--danger);color:var(--danger);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn-danger:hover{background:#2a1515;}
.btn-sm{padding:5px 12px;font-size:12px;}
.btn-warn{background:#2a2010;color:#e0a855;border:1px solid #4a3a10;}
.btn-warn:hover{background:#3a3010;}
/* Stats */
.stats-row{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;}
.stat-pill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-size:12px;display:flex;align-items:center;gap:8px;}
.stat-pill-val{font-weight:700;font-family:var(--mono);color:var(--accent);}
/* Toolbar */
.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.toolbar-busca{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 12px;outline:none;}
.toolbar-busca:focus{border-color:var(--border-focus);}
.toolbar-select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--sans);font-size:12px;padding:7px 10px;outline:none;}
.toolbar-select:focus{border-color:var(--border-focus);}
/* Accordion categoria */
.cat-block{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.cat-header{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .15s;user-select:none;}
.cat-header:hover{background:var(--surface2);}
.cat-toggle{font-size:12px;color:var(--text3);transition:transform .2s;flex-shrink:0;}
.cat-toggle.open{transform:rotate(90deg);}
.cat-nome{font-size:13px;font-weight:600;flex:1;}
.cat-count{font-size:11px;color:var(--text3);font-family:var(--mono);}
.cat-body{display:none;border-top:1px solid var(--border);}
.cat-body.open{display:block;}
/* Item linha */
.item-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);transition:background .1s;}
.item-row:last-child{border-bottom:none;}
.item-row:hover{background:var(--surface2);}
.item-row.inativo{opacity:.5;}
.item-nome{flex:1;font-size:13px;}
.item-unidade{font-size:11px;color:var(--text3);font-family:var(--mono);min-width:70px;}
.item-rec{font-size:10px;padding:2px 7px;border-radius:3px;font-family:var(--mono);white-space:nowrap;}
.rec-unica{background:#1e2333;color:var(--text2);border:1px solid var(--border);}
.rec-mensal{background:#0e2820;color:#2dd4a0;border:1px solid #1a4a38;}
.rec-anual{background:#1a2540;color:#7aabf7;border:1px solid #2a4070;}
.rec-campanha{background:#1e1a40;color:#a78bfa;border:1px solid #3a2a80;}
.rec-turma{background:#2a2010;color:#e0a855;border:1px solid #4a3a10;}
.rec-evento{background:#2a1515;color:#ff9f43;border:1px solid #5a3010;}
.rec-outro{background:#1e2333;color:var(--text2);border:1px solid var(--border);}
.item-preco{font-size:13px;font-family:var(--mono);font-weight:500;min-width:110px;text-align:right;color:var(--accent2);}
.item-preco.dinamico{color:var(--warning);font-size:11px;}
.item-actions{display:flex;gap:6px;flex-shrink:0;}
/* Toggle ativo */
.toggle-ativo{position:relative;width:36px;height:20px;flex-shrink:0;}
.toggle-ativo input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:20px;transition:.2s;}
.toggle-slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}
input:checked + .toggle-slider{background:var(--accent2);}
input:checked + .toggle-slider:before{transform:translateX(16px);}
/* Status bar */
.status-bar{display:none;padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-top:12px;align-items:center;gap:8px;}
.status-bar.show{display:flex;}
.status-bar.success{background:#0e2820;border:1px solid #1a4a38;color:var(--success);}
.status-bar.error{background:#2a1515;border:1px solid #4a2020;color:var(--danger);}
.status-bar.info{background:#1a2540;border:1px solid #2a4070;color:#7aabf7;}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;}
.spinner.show{display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;max-width:720px;width:100%;margin:auto;}
.modal-titulo{font-size:16px;font-weight:500;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
.modal-titulo button{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;line-height:1;}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.modal-field{margin-bottom:0;}
.modal-field.full{grid-column:1/-1;}
.modal-field label{display:block;font-size:11px;font-weight:500;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
.modal-field input,.modal-field select,.modal-field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--sans);font-size:13px;padding:9px 12px;outline:none;}
.modal-field input:focus,.modal-field select:focus,.modal-field textarea:focus{border-color:var(--border-focus);}
.modal-field textarea{resize:vertical;min-height:70px;}
/* Tabela dinâmica GR */
.gr-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px;}
.gr-table th{background:var(--surface2);color:var(--text2);padding:6px 8px;text-align:center;font-size:11px;font-weight:600;border:1px solid var(--border);}
.gr-table th:first-child{text-align:left;}
.gr-table td{padding:4px;border:1px solid var(--border);}
.gr-table td:first-child{padding:6px 8px;color:var(--text2);font-weight:600;font-size:11px;background:var(--surface2);white-space:nowrap;}
.gr-table input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--mono);font-size:12px;padding:5px 7px;outline:none;text-align:right;}
.gr-table input:focus{border-color:var(--border-focus);}
.tipo-hint{font-size:11px;color:var(--text3);margin-top:4px;}
/* Empty */
.empty{text-align:center;padding:40px;color:var(--text3);}
</style>
<script src="trial_check.js"></script>
</head>

// ── INICIALIZAÇÃO ─────────────────────────────────────────────────────────────
async function init(){
  // RLS filtra automaticamente as empresas do usuário logado
  const r=await fetch(`${SUPA_URL}/rest/v1/empresas?ativo=eq.true&select=id&order=id.asc&limit=1`,{headers:h2()});
  const u=await r.json();
  if(!u||!u[0]){setStatus('status-global','error','Nenhuma empresa encontrada. Cadastre uma empresa primeiro.');return;}
  empresaId=u[0].id;
  await carregarCatalogo();
}

async function carregarCatalogo(){
  const r=await fetch(`${SUPA_URL}/rest/v1/orcamento_catalogo?empresa_id=eq.${empresaId}&select=*&order=categoria.asc,ordem.asc,nome.asc`,{headers:h2()});
  catalogo=await r.json();
  if(!Array.isArray(catalogo)||catalogo.length===0){
    await executarSeed();
    return;
  }
  renderCatalogo();
  atualizarStats();
  popularFiltros();
}

async function executarSeed(){
  setStatus('status-global','info','Configurando catálogo padrão...');
  const payload=CATALOGO_SEED.map((s,i)=>{
    const obj={...s,empresa_id:empresaId,ordem:s.ordem||i};
    if(s.tipo==='tabela_dinamica'&&TABELAS_PADRAO[s.nome]){
      obj.precos_json={faixas:FAIXAS,...TABELAS_PADRAO[s.nome]};
    }
    return obj;
  });
  const r=await fetch(`${SUPA_URL}/rest/v1/orcamento_catalogo`,{
    method:'POST',headers:{...h2(),'Prefer':'return=representation'},
    body:JSON.stringify(payload)
  });
  if(!r.ok){const e=await r.text();setStatus('status-global','error','Erro ao criar catálogo: '+e);return;}
  catalogo=await r.json();
  clearStatus('status-global');
  renderCatalogo();atualizarStats();popularFiltros();
}

function atualizarStats(){
  const ativos=catalogo.filter(x=>x.ativo).length;
  document.getElementById('stat-total').textContent=catalogo.length;
  document.getElementById('stat-ativos').textContent=ativos;
  document.getElementById('stat-inativos').textContent=catalogo.length-ativos;
  const cats=[...new Set(catalogo.map(x=>x.categoria))];
  document.getElementById('stat-cats').textContent=cats.length;
}

function popularFiltros(){
  const sel=document.getElementById('filtro-cat');
  const cats=[...new Set(catalogo.map(x=>x.categoria))].sort();
  const cur=sel.value;
  sel.innerHTML='<option value="">Todas as categorias</option>'+cats.map(c=>`<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('');
  if(cur)sel.value=cur;
}

function renderCatalogo(){
  const busca=document.getElementById('busca').value.toLowerCase();
  const filtCat=document.getElementById('filtro-cat').value;
  const filtStatus=document.getElementById('filtro-status').value;

  let itens=catalogo.filter(item=>{
    const mBusca=!busca||item.nome.toLowerCase().includes(busca)||item.categoria.toLowerCase().includes(busca);
    const mCat=!filtCat||item.categoria===filtCat;
    const mStatus=!filtStatus||(filtStatus==='ativo'&&item.ativo)||(filtStatus==='inativo'&&!item.ativo);
    return mBusca&&mCat&&mStatus;
  });

  const porCat={};
  itens.forEach(item=>{
    if(!porCat[item.categoria])porCat[item.categoria]=[];
    porCat[item.categoria].push(item);
  });

  const container=document.getElementById('lista-catalogo');
  if(Object.keys(porCat).length===0){container.innerHTML='<div class="empty">Nenhum serviço encontrado.</div>';return;}

  container.innerHTML=Object.keys(porCat).sort().map(cat=>{
    const itensHtml=porCat[cat].map(item=>renderItem(item)).join('');
    return`<div class="cat-block">
      <div class="cat-header" onclick="toggleCat(this)">
        <span class="cat-toggle">▶</span>
        <span class="cat-nome">${escHtml(cat)}</span>
        <span class="cat-count">${porCat[cat].length} serviços</span>
      </div>
      <div class="cat-body open">${itensHtml}</div>
    </div>`;
  }).join('');
}

function toggleCat(header){
  const body=header.nextElementSibling;
  const tog=header.querySelector('.cat-toggle');
  body.classList.toggle('open');
  tog.classList.toggle('open');
}

function renderItem(item){
  const recClass={
    unica:'rec-unica',mensal:'rec-mensal',anual:'rec-anual',bienal:'rec-anual',
    trimestral:'rec-anual',semestral:'rec-anual',
    'por campanha':'rec-campanha','por turma':'rec-turma','por evento':'rec-evento'
  }[item.recorrencia]||'rec-outro';

  const precoTxt=item.tipo==='tabela_dinamica'
    ?'<span class="item-preco dinamico">tabela GR×func.</span>'
    :item.tipo==='percentual'
    ?`<span class="item-preco">${((item.percentual||0)*100).toFixed(0)}%</span>`
    :`<span class="item-preco">${fmtBRL(item.preco_padrao)}</span>`;

  return`<div class="item-row${item.ativo?'':' inativo'}" id="row-${item.id}">
    <div class="item-nome">${escHtml(item.nome)}</div>
    <div class="item-unidade">${escHtml(item.unidade)}</div>
    <span class="item-rec ${recClass}">${escHtml(item.recorrencia)}</span>
    ${precoTxt}
    <label class="toggle-ativo" title="${item.ativo?'Desativar':'Ativar'}">
      <input type="checkbox" ${item.ativo?'checked':''} onchange="toggleAtivo('${item.id}',this.checked)">
      <span class="toggle-slider"></span>
    </label>
    <div class="item-actions">
      <button class="btn btn-edit btn-sm" onclick="abrirModalEditar('${item.id}')">Editar</button>
    </div>
  </div>`;
}

// ── TOGGLE ATIVO ──────────────────────────────────────────────────────────────
async function toggleAtivo(id,ativo){
  const r=await fetch(`${SUPA_URL}/rest/v1/orcamento_catalogo?id=eq.${id}`,{
    method:'PATCH',headers:{...h2(),'Prefer':'return=representation'},
    body:JSON.stringify({ativo,atualizado_em:new Date().toISOString()})
  });
  if(!r.ok)return;
  const idx=catalogo.findIndex(x=>x.id===id);
  if(idx>=0)catalogo[idx].ativo=ativo;
  const row=document.getElementById('row-'+id);
  if(row)row.classList.toggle('inativo',!ativo);
  atualizarStats();
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function abrirModalNovo(){
  editandoId=null;
  document.getElementById('modal-titulo-txt').textContent='Novo Serviço';
  limparModal();
  document.getElementById('modal-servico').classList.add('show');
}

function abrirModalEditar(id){
  const item=catalogo.find(x=>x.id===id);
  if(!item)return;
  editandoId=id;
  document.getElementById('modal-titulo-txt').textContent='Editar Serviço';
  limparModal();
  document.getElementById('sv-categoria').value=item.categoria;
  document.getElementById('sv-nome').value=item.nome;
  document.getElementById('sv-descricao').value=item.descricao||'';
  document.getElementById('sv-unidade').value=item.unidade;
  document.getElementById('sv-recorrencia').value=item.recorrencia;
  document.getElementById('sv-tipo').value=item.tipo;
  document.getElementById('sv-ativo').value=String(item.ativo);
  if(item.tipo==='tabela_dinamica'&&item.precos_json){
    GRS.forEach(gr=>{
      (item.precos_json[gr]||[]).forEach((v,i)=>{
        const el=document.getElementById(`gr-${gr}-${i}`);
        if(el)el.value=v||'';
      });
    });
  }else if(item.tipo==='percentual'){
    document.getElementById('sv-percentual').value=((item.percentual||0)*100).toFixed(1);
  }else{
    document.getElementById('sv-preco').value=item.preco_padrao||'';
  }
  atualizarTipoPreco();
  document.getElementById('modal-servico').classList.add('show');
}

function fecharModal(){
  document.getElementById('modal-servico').classList.remove('show');
  clearStatus('status-modal');
}

function limparModal(){
  ['sv-categoria','sv-nova-categoria','sv-nome','sv-descricao','sv-preco','sv-percentual'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.value='';
  });
  document.getElementById('sv-unidade').value='unidade';
  document.getElementById('sv-recorrencia').value='unica';
  document.getElementById('sv-tipo').value='servico';
  document.getElementById('sv-ativo').value='true';
  GRS.forEach(gr=>[0,1,2,3,4].forEach(i=>{const el=document.getElementById(`gr-${gr}-${i}`);if(el)el.value='';}));
  atualizarTipoPreco();
  clearStatus('status-modal');
}

function popularCatSelect(){
  const val=document.getElementById('sv-categoria').value;
  document.getElementById('campo-nova-cat').style.display=val==='__nova__'?'block':'none';
}

function atualizarTipoPreco(){
  const tipo=document.getElementById('sv-tipo').value;
  document.getElementById('campo-preco-fixo').style.display=(tipo==='servico'||tipo==='por_funcionario')?'block':'none';
  document.getElementById('campo-percentual').style.display=tipo==='percentual'?'block':'none';
  document.getElementById('campo-tabela-dinamica').style.display=tipo==='tabela_dinamica'?'block':'none';
  const hints={servico:'Preço fixo por unidade.',tabela_dinamica:'O preço é calculado automaticamente conforme o Grau de Risco e o número de funções do cliente.',percentual:'Calculado como percentual sobre o subtotal do orçamento.',por_funcionario:'Preço por funcionário cadastrado.'};
  document.getElementById('tipo-hint').textContent=hints[tipo]||'';
}

// ── SALVAR ────────────────────────────────────────────────────────────────────
async function salvarServico(){
  const btn=document.getElementById('btn-salvar-sv');
  const spinner=document.getElementById('spinner-sv');
  const label=document.getElementById('label-salvar-sv');
  btn.disabled=true;spinner.className='spinner show';label.textContent='Salvando...';
  try{
    let catVal=document.getElementById('sv-categoria').value;
    if(catVal==='__nova__')catVal=document.getElementById('sv-nova-categoria').value.trim();
    const nome=document.getElementById('sv-nome').value.trim();
    if(!catVal||!nome){setStatus('status-modal','error','Preencha categoria e nome.');return;}

    const tipo=document.getElementById('sv-tipo').value;
    const payload={
      empresa_id:empresaId,
      categoria:catVal,
      nome,
      descricao:document.getElementById('sv-descricao').value.trim()||null,
      unidade:document.getElementById('sv-unidade').value,
      tipo,
      recorrencia:document.getElementById('sv-recorrencia').value,
      ativo:document.getElementById('sv-ativo').value==='true',
      atualizado_em:new Date().toISOString()
    };

    if(tipo==='tabela_dinamica'){
      const pj={faixas:FAIXAS};
      GRS.forEach(gr=>{pj[gr]=[0,1,2,3,4].map(i=>parseFloat(document.getElementById(`gr-${gr}-${i}`).value)||0);});
      payload.precos_json=pj;
      payload.preco_padrao=pj['GR1'][0]||0;
    }else if(tipo==='percentual'){
      payload.percentual=parseFloat(document.getElementById('sv-percentual').value)/100||0;
      payload.preco_padrao=0;
    }else{
      payload.preco_padrao=parseFloat(document.getElementById('sv-preco').value)||0;
    }

    let r;
    if(editandoId){
      r=await fetch(`${SUPA_URL}/rest/v1/orcamento_catalogo?id=eq.${editandoId}`,{
        method:'PATCH',headers:{...h2(),'Prefer':'return=representation'},body:JSON.stringify(payload)
      });
    }else{
      payload.ordem=catalogo.filter(x=>x.categoria===catVal).length*10+10;
      r=await fetch(`${SUPA_URL}/rest/v1/orcamento_catalogo`,{
        method:'POST',headers:{...h2(),'Prefer':'return=representation'},body:JSON.stringify(payload)
      });
    }
    if(!r.ok){const e=await r.text();setStatus('status-modal','error','Erro: '+e);return;}
    const saved=await r.json();
    if(editandoId){const idx=catalogo.findIndex(x=>x.id===editandoId);if(idx>=0)catalogo[idx]=saved[0]||saved;}
    else{catalogo.push(saved[0]||saved);}
    fecharModal();renderCatalogo();atualizarStats();popularFiltros();
    setStatus('status-global','success','Serviço salvo com sucesso.');
    setTimeout(()=>clearStatus('status-global'),3000);
  }catch(e){setStatus('status-modal','error',e.message);}
  finally{btn.disabled=false;spinner.className='spinner';label.textContent='Salvar';}
}

// ── RESTAURAR PADRÕES ─────────────────────────────────────────────────────────
async function confirmarRestaurar(){
  if(!confirm('Atenção: isso vai APAGAR todo o catálogo atual e restaurar os 77 serviços padrão.\n\nOs orçamentos existentes não serão afetados.\n\nDeseja continuar?'))return;
  setStatus('status-global','info','Restaurando catálogo...');
  await fetch(`${SUPA_URL}/rest/v1/orcamento_catalogo?empresa_id=eq.${empresaId}`,{method:'DELETE',headers:h2()});
  catalogo=[];
  await executarSeed();
  setStatus('status-global','success','Catálogo restaurado com sucesso.');
  setTimeout(()=>clearStatus('status-global'),3000);
}
