name: Importar Base CAEPI

on:
  schedule:
    - cron: '0 3 * * 1'   # toda segunda-feira às 3h UTC
  workflow_dispatch:        # permite rodar manualmente pelo GitHub

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Importar base CAEPI
        env:
          SUPA_URL:         ${{ secrets.SUPA_URL }}
          SUPA_SERVICE_KEY: ${{ secrets.SUPA_SERVICE_KEY }}
        run: python .github/scripts/importar_caepi.py
