<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGS — Empresas Contratadas</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="trial_check.js"></script>
<style>
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2333;--border:#2a3044;--border-focus:#4a7cdc;
  --accent:#4a7cdc;--accent2:#2dd4a0;--text:#e8eaf0;--text2:#8892a4;--text3:#545e72;
  --danger:#e05555;--warning:#e0a855;--success:#2dd4a0;
  --radius:6px;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
.header-logo{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.08em;border:1px solid var(--border-focus);padding:4px 10px;border-radius:var(--radius);text-decoration:none;}
.header-title{font-size:13px;color:var(--text2);flex:1;}
.header-title span{color:var(--text);font-weight:500;}
.container{max-width:960px;margin:0 auto;padding:32px 24px 80px;}
.voltar{font-size:12px;color:var(--text2);text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;}
.voltar:hover{color:var(--text);}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.page-title{font-size:20px;font-weight:500;}
.page-sub{font-size:13px;color:var(--text2);margin-top:4px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#5a8ce8;}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);font-size:12px;padding:4px 10px;}
.btn-danger:hover{background:#2a1515;}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--border-focus);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:14px;}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;}
.card-nome{font-size:15px;font-weight:500;}
.card-cnpj{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:2px;}
.card-body{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.card-field{font-size:12px;}
.card-field-label{color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
.card-field-value{color:var(--text2);}
.badge-freq{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:11px;color:var(--text2);}
.empty{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-icon{font-size:40px;margin-bottom:12px;}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:560px;margin:auto;}
.modal-titulo{font-size:16px;font-weight:500;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;}
.modal-close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:0;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:500;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;}
.field .req{color:var(--accent);margin-left:2px;}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--sans);font-size:13px;padding:9px 12px;outline:none;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--border-focus);}
textarea{resize:vertical;min-height:70px;}
select option{background:var(--surface2);}
.checkbox-group{display:flex;flex-wrap:wrap;gap:8px;}
.checkbox-item{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;cursor:pointer;transition:border-color .15s;}
.checkbox-item:hover{border-color:var(--border-focus);}
.checkbox-item input{width:14px;height:14px;accent-color:var(--accent);flex-shrink:0;}
.checkbox-item label{font-size:12px;color:var(--text2);cursor:pointer;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.status-bar{display:none;padding:10px 14px;border-radius:var(--radius);font-size:12px;margin-top:12px;align-items:center;gap:8px;}
.status-bar.show{display:flex;}
.status-bar.success{background:#0e2820;border:1px solid #1a4a38;color:var(--success);}
.status-bar.error{background:#2a1515;border:1px solid #4a2020;color:var(--danger);}
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="header-logo">SGS</a>
  <div class="header-title">Sistema de Gestão em SST &nbsp;/&nbsp; <span id="page-title">Empresas Contratadas</span></div>
</div>

<div class="container">
  <a href="#" class="voltar" id="btn-voltar">← Voltar para a empresa</a>

  <div class="page-header">
    <div>
      <div class="page-title">Empresas Contratadas</div>
      <div class="page-sub" id="page-sub">Carregando...</div>
    </div>
    <button class="btn btn-primary" onclick="abrirModal()">+ Nova contratada</button>
  </div>

  <div id="lista-contratadas">
    <div class="empty"><div class="empty-icon">🏗️</div>Carregando...</div>
  </div>
</div>

<!-- Modal cadastro/edição -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-titulo">
      <span id="modal-titulo">Nova Empresa Contratada</span>
      <button class="modal-close" onclick="fecharModal()">×</button>
    </div>

    <div class="field">
      <label>Razão Social <span class="req">*</span></label>
      <input type="text" id="f-razao" placeholder="Nome da empresa contratada">
    </div>
    <div class="field">
      <label>CNPJ</label>
      <input type="text" id="f-cnpj" placeholder="00.000.000/0001-00" maxlength="18" oninput="formatarCNPJ(this)">
    </div>
    <div class="field">
      <label>Serviço prestado <span class="req">*</span></label>
      <input type="text" id="f-servico" placeholder="Ex: Limpeza e conservação, Manutenção elétrica">
    </div>
    <div class="field">
      <label>Frequência de atuação</label>
      <select id="f-frequencia">
        <option value="">— Selecionar —</option>
        <option value="Diária">Diária</option>
        <option value="Semanal">Semanal</option>
        <option value="Mensal">Mensal</option>
        <option value="Eventual">Eventual</option>
      </select>
    </div>
    <div class="field">
      <label>Riscos a que ficam expostos no local</label>
      <div class="checkbox-group" id="riscos-checks">
        ${['Físico','Químico','Biológico','Ergonômico','Acidente','Psicossocial'].map(r=>`
          <div class="checkbox-item">
            <input type="checkbox" id="risco-${r}" value="${r}">
            <label for="risco-${r}">${r}</label>
          </div>`).join('')}
      </div>
    </div>
    <div class="field">
      <label>Setores onde atuam</label>
      <input type="text" id="f-setores" placeholder="Ex: Produção, Almoxarifado, Toda a empresa">
    </div>
    <div class="field">
      <label>Medidas de controle acordadas</label>
      <textarea id="f-medidas" placeholder="Ex: EPI obrigatório fornecido pelo contratante, Permissão de Trabalho obrigatória, Treinamento de integração SST"></textarea>
    </div>

    <div class="status-bar" id="status-modal"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvar()">Salvar</button>
    </div>
  </div>
</div>

<script>
const SUPA_URL='https://ookqdukeulwcnhilbgbo.supabase.co';
const SUPA_KEY='sb_publishable_l9NggU-e1bgt7CnrYUWo4w_AMoaJa2e';
const token=localStorage.getItem('sgs_token');
if(!token)window.location.href='login.html';

const params=new URLSearchParams(window.location.search);
const empresaId=params.get('empresa_id');
if(!empresaId)window.location.href='empresas.html';

const h2={apikey:SUPA_KEY,Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
let empresa=null;
let contratadas=[];
let editandoId=null;

document.getElementById('btn-voltar').href=`empresa_detalhe.html?id=${empresaId}`;

async function carregar(){
  const [resEmp,resCont]=await Promise.all([
    fetch(`${SUPA_URL}/rest/v1/empresas?id=eq.${empresaId}&select=razao_social,nome_fantasia`,{headers:h2}),
    fetch(`${SUPA_URL}/rest/v1/empresa_contratadas?empresa_id=eq.${empresaId}&ativo=eq.true&select=*&order=razao_social.asc`,{headers:h2})
  ]);
  empresa=(await resEmp.json())[0];
  contratadas=await resCont.json();
  const nomeEmp=empresa?.nome_fantasia||empresa?.razao_social||'Empresa';
  document.getElementById('page-sub').textContent=nomeEmp;
  document.getElementById('page-title').textContent=`Empresas Contratadas — ${nomeEmp}`;
  renderLista();
}

function renderLista(){
  const el=document.getElementById('lista-contratadas');
  if(!contratadas.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">🏗️</div><div style="font-size:15px;font-weight:500;margin-bottom:6px;">Nenhuma empresa contratada cadastrada</div><div style="font-size:13px;">Clique em "+ Nova contratada" para registrar empresas terceirizadas que atuam nesta empresa.</div></div>`;
    return;
  }
  el.innerHTML=contratadas.map(c=>`
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-nome">${h(c.razao_social)}</div>
          ${c.cnpj?`<div class="card-cnpj">${h(c.cnpj)}</div>`:''}
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          ${c.frequencia?`<span class="badge-freq">${h(c.frequencia)}</span>`:''}
          <button class="btn btn-ghost" style="font-size:12px;padding:5px 12px;" onclick="editar(${c.id})">Editar</button>
          <button class="btn btn-danger" onclick="excluir(${c.id})">✕</button>
        </div>
      </div>
      <div class="card-body">
        <div class="card-field"><div class="card-field-label">Serviço</div><div class="card-field-value">${h(c.servico_prestado)}</div></div>
        ${c.riscos_categorias?`<div class="card-field"><div class="card-field-label">Riscos no local</div><div class="card-field-value">${h(c.riscos_categorias)}</div></div>`:''}
        ${c.setores_atuacao?`<div class="card-field"><div class="card-field-label">Setores</div><div class="card-field-value">${h(c.setores_atuacao)}</div></div>`:''}
        ${c.medidas_acordadas?`<div class="card-field" style="grid-column:1/-1;"><div class="card-field-label">Medidas acordadas</div><div class="card-field-value">${h(c.medidas_acordadas)}</div></div>`:''}
      </div>
    </div>`).join('');
}

function h(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function abrirModal(c=null){
  editandoId=c?.id||null;
  document.getElementById('modal-titulo').textContent=c?'Editar Contratada':'Nova Empresa Contratada';
  document.getElementById('f-razao').value=c?.razao_social||'';
  document.getElementById('f-cnpj').value=c?.cnpj||'';
  document.getElementById('f-servico').value=c?.servico_prestado||'';
  document.getElementById('f-frequencia').value=c?.frequencia||'';
  document.getElementById('f-setores').value=c?.setores_atuacao||'';
  document.getElementById('f-medidas').value=c?.medidas_acordadas||'';
  const riscosAtivos=(c?.riscos_categorias||'').split(',').map(r=>r.trim());
  ['Físico','Químico','Biológico','Ergonômico','Acidente','Psicossocial'].forEach(r=>{
    document.getElementById(`risco-${r}`).checked=riscosAtivos.includes(r);
  });
  document.getElementById('status-modal').className='status-bar';
  document.getElementById('modal').classList.add('show');
}

function fecharModal(){document.getElementById('modal').classList.remove('show');editandoId=null;}

function editar(id){abrirModal(contratadas.find(c=>c.id===id));}

async function salvar(){
  const razao=document.getElementById('f-razao').value.trim();
  const servico=document.getElementById('f-servico').value.trim();
  if(!razao||!servico){setStatus('error','Preencha Razão Social e Serviço.');return;}
  const riscosMarcados=['Físico','Químico','Biológico','Ergonômico','Acidente','Psicossocial']
    .filter(r=>document.getElementById(`risco-${r}`).checked).join(', ');
  const payload={
    empresa_id:parseInt(empresaId),
    razao_social:razao,
    cnpj:document.getElementById('f-cnpj').value.trim()||null,
    servico_prestado:servico,
    frequencia:document.getElementById('f-frequencia').value||null,
    riscos_categorias:riscosMarcados||null,
    setores_atuacao:document.getElementById('f-setores').value.trim()||null,
    medidas_acordadas:document.getElementById('f-medidas').value.trim()||null,
    ativo:true,
    atualizado_em:new Date().toISOString()
  };
  try{
    if(editandoId){
      await fetch(`${SUPA_URL}/rest/v1/empresa_contratadas?id=eq.${editandoId}`,{method:'PATCH',headers:h2,body:JSON.stringify(payload)});
    }else{
      await fetch(`${SUPA_URL}/rest/v1/empresa_contratadas`,{method:'POST',headers:h2,body:JSON.stringify(payload)});
    }
    setStatus('success','✓ Salvo com sucesso!');
    setTimeout(()=>{fecharModal();carregar();},800);
  }catch(e){setStatus('error','Erro ao salvar.');}
}

async function excluir(id){
  if(!confirm('Remover esta empresa contratada?'))return;
  await fetch(`${SUPA_URL}/rest/v1/empresa_contratadas?id=eq.${id}`,{method:'PATCH',headers:h2,body:JSON.stringify({ativo:false})});
  carregar();
}

function setStatus(tipo,msg){
  const el=document.getElementById('status-modal');
  el.className=`status-bar show ${tipo}`;
  el.textContent=msg;
}

function formatarCNPJ(el){
  let v=el.value.replace(/\D/g,'').substring(0,14);
  v=v.replace(/^(\d{2})(\d)/,'$1.$2');
  v=v.replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3');
  v=v.replace(/\.(\d{3})(\d)/,'.$1/$2');
  v=v.replace(/(\d{4})(\d)/,'$1-$2');
  el.value=v;
}

carregar();
</script>
</body>
</html>
